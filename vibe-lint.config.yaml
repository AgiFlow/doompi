# Architectural review for the standalone DoomPi package workspace.
root: true

plugins:
  - core
  - doom-extension

extends:
  - core/recommended

ignore:
  - "**/*.md"
  - "**/*.mdx"
  - "**/*.txt"
  # Nothing to review in a binary, a licence, or a vendored model blob. They
  # are listed because a directory check walks everything git tracks, and an
  # asset with no boundary would otherwise report as an uncovered file.
  - "**/*.png"
  - "**/*.svg"
  - "**/*.ico"
  - "**/*.onnx"
  - "**/*LICENSE*"
  - "**/*.gen.ts"
  - "**/__generated__/**"
  - "**/vendor/**"
  - "migration-records/**"

boundaries:
  - name: packages
    pattern: "packages/**"
  - name: layers
    pattern: "layers/**"
  - name: repository-config
    pattern: "{nx.json,package.json,pnpm-lock.yaml,pnpm-workspace.yaml,vibe-lint.config.yaml}"

overrides:
  - files:
      - "*.config.*"
      - "**/*.config.*"
    rules:
      no-default-export: off
