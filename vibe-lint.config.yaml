# Architectural review for the standalone DoomPi package workspace.
root: true

plugins:
  - core
  - doom-extension

extends:
  - core/recommended

ignore:
  - "**/*.md"
  - "**/*.mdx"
  - "**/*.txt"
  # Nothing to review in a binary, a licence, or a vendored model blob. They
  # are listed because a directory check walks everything git tracks, and an
  # asset with no boundary would otherwise report as an uncovered file.
  - "**/*.png"
  - "**/*.svg"
  - "**/*.ico"
  - "**/*.onnx"
  - "**/*LICENSE*"
  - "**/*.gen.ts"
  - "**/__generated__/**"
  - "**/vendor/**"
  - "migration-records/**"

boundaries:
  - name: packages
    pattern: "packages/**"
  - name: layers
    pattern: "layers/**"
  - name: repository-config
    pattern: "{nx.json,package.json,pnpm-lock.yaml,pnpm-workspace.yaml,vibe-lint.config.yaml}"

overrides:
  - files:
      - "*.config.*"
      - "**/*.config.*"
    rules:
      no-default-export: off
  - files:
      - "**/src/extension/**/*"
      - "**/src/extensions/**/*"
    rules:
      # Route identity follows the host's path grammar. Commands are kebab-case,
      # hooks are event names, and component routes may be PascalCase.
      file-naming-convention: off

llm:
  providers:
    - tool: script
      command: doompi
      args:
        - --major-mode
        - minimal
        - --no-domains
        - --no-mcp
        - --mute
        - --no-agents
        - --output-format=vibe-lint
        - --model
        - openai-codex/gpt-5.6-luna
        - --thinking
        - low
    - tool: antigravity
      model: gemini-3.6-flash-medium
      timeout: 180000
    - tool: claude-code
      model: claude-haiku-4-5-20251001
