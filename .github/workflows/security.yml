name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out materialized package snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject vulnerable dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Check out materialized package snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Analyze JavaScript and TypeScript
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out materialized package snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
          cache: pnpm

      - name: Reject known high-severity production vulnerabilities
        run: |
          for attempt in 1 2 3; do
            set +e
            output="$(pnpm audit --prod --audit-level high 2>&1)"
            status=$?
            set -e
            printf '%s\n' "$output"
            if [[ $status -eq 0 ]]; then
              exit 0
            fi
            if ! grep -Eqi 'timeout|timed out|error \(23\)|ECONNRESET|ETIMEDOUT|EAI_AGAIN' <<<"$output"; then
              exit "$status"
            fi
            if [[ $attempt -eq 3 ]]; then
              exit "$status"
            fi
            echo "Registry audit transport failed, retrying attempt $((attempt + 1)) of 3."
            sleep $((attempt * 15))
          done

      - name: Install dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify registry signatures during burn-in
        continue-on-error: true
        run: pnpm audit signatures

  secret-scan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the complete pull request history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reject verified secrets in pull request commits
        uses: trufflesecurity/trufflehog@20652fbbdefffcdaa493a5bf57ab2ac6b1db715b # v3.97.1
        with:
          extra_args: --only-verified

  workflow-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out materialized package snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned zizmor CLI
        run: |
          python3 -m venv "${RUNNER_TEMP}/zizmor"
          "${RUNNER_TEMP}/zizmor/bin/pip" install \
            --disable-pip-version-check \
            --no-input \
            "zizmor==1.29.0"

      - name: Reject high-severity GitHub Actions vulnerabilities
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "${RUNNER_TEMP}/zizmor/bin/zizmor" \
            --format github \
            --min-confidence high \
            --min-severity high \
            .github/workflows

  # Scorecard evaluates repository-wide controls on the default branch. Its
  # upstream action does not support pull request revisions.
  scorecard:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Analyze open source security posture
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          publish_results: false
          results_file: scorecard-results.sarif
          results_format: sarif

      - name: Upload results to code scanning
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: scorecard-results.sarif

  # Keep one stable required check in the repository ruleset. Individual jobs may
  # evolve, but every pull request must pass all of them before this job succeeds.
  security-gate:
    if: always() && github.event_name == 'pull_request'
    needs:
      - dependency-review
      - codeql
      - dependency-audit
      - secret-scan
      - workflow-security
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every security check to pass
        env:
          CODEQL_RESULT: ${{ needs.codeql.result }}
          DEPENDENCY_AUDIT_RESULT: ${{ needs.dependency-audit.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
          WORKFLOW_SECURITY_RESULT: ${{ needs.workflow-security.result }}
        run: |
          results=(
            "$CODEQL_RESULT"
            "$DEPENDENCY_AUDIT_RESULT"
            "$DEPENDENCY_REVIEW_RESULT"
            "$SECRET_SCAN_RESULT"
            "$WORKFLOW_SECURITY_RESULT"
          )

          for result in "${results[@]}"; do
            if [[ "$result" != "success" ]]; then
              printf 'A required security job finished with result: %s\n' "$result"
              exit 1
            fi
          done
