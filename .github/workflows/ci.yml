name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job runs on a GitHub-hosted runner.
#
# A pull request from a fork is untrusted code, and this workspace runs install
# scripts (the root `prepare` builds the vibe-lint plugin) before any check has
# had a chance to look at the diff. On a public repository that is arbitrary
# execution on whatever machine picks the job up, so it must not be ours. A
# disposable hosted runner satisfies that for every trigger, not just forks.

jobs:
  # The quality gate used to run every check serially in one job. Keep the
  # independent checks on separate hosted runners so pull-request feedback is
  # bounded by the slowest shard instead of the sum of every command.
  quality_checks:
    name: Quality (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Repository checks
            command: |
              pnpm runner:check
              node --test scripts/fetch-runner-binaries.test.mjs
              pnpm audit:workspace
              pnpm fmt:check
              pnpm hooks:check
          - name: Build and examples
            command: |
              pnpm nx run-many -t build --parallel=3
              pnpm examples:check
          - name: Lint
            command: pnpm nx run-many -t lint --parallel=3
          - name: Vibe-Lint
            command: |
              pnpm nx run-many -t build --parallel=3
              pnpm lint:vibe --preflight-only
          - name: Type-check
            command: pnpm nx run-many -t typecheck --parallel=3
          - name: Tests
            command: pnpm nx run-many -t test --parallel=3
    steps:
      - name: Check out materialized package snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up DoomPi workspace
        uses: ./.github/actions/setup-monorepo

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}

  # Keep the existing stable quality check name for branch protection while the
  # execution strategy evolves behind it.
  quality:
    if: always()
    needs: quality_checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every quality shard to pass
        env:
          QUALITY_RESULT: ${{ needs.quality_checks.result }}
        run: |
          if [[ "$QUALITY_RESULT" != "success" ]]; then
            printf "A quality shard finished with result: %s\n" "$QUALITY_RESULT"
            exit 1
          fi
  # Browser gate for the cockpit.
  #
  # Package tests render every plugin component to static markup, which proves
  # they mount and read the props the host sends. What they cannot reach is a
  # click, an effect, or a Radix portal, so the specs here are the only thing
  # that exercises the cockpit as a running program: sessions, the transcript,
  # dialogs, leader keys, and the plugin tabs.
  #
  # Each shard gets a disposable hosted runner. They intentionally start beside
  # the quality shards instead of waiting for them, trading some runner minutes
  # on an early failure for a shorter pull-request feedback loop.
  browser:
    name: Browser E2E (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Check out materialized package snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up DoomPi workspace
        uses: ./.github/actions/setup-monorepo

      - name: Build the cockpit and the servers it spawns
        run: pnpm cockpit:build

      - name: Install the Chromium the shard drives
        run: pnpm --filter @agimon-ai/doompi-web exec playwright install --with-deps chromium

      - name: Drive the cockpit in a browser
        run: pnpm nx run @agimon-ai/doompi-web:test:e2e -- --shard=${{ matrix.shard }}/4

      - name: Keep the traces of a failed shard
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-web-${{ matrix.shard }}
          path: |
            packages/clients/doompi-web/playwright-report
            packages/clients/doompi-web/test-results
          retention-days: 7

  desktop:
    name: Desktop E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out materialized package snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up DoomPi workspace
        uses: ./.github/actions/setup-monorepo

      - name: Build the cockpit and the servers it spawns
        run: pnpm cockpit:build

      - name: Build the desktop main and preload
        run: pnpm nx run @agimon-ai/doompi-desktop:build

      - name: Install Electron system dependencies
        run: pnpm --filter @agimon-ai/doompi-desktop exec playwright install-deps

      - name: Drive the desktop app in Electron
        run: xvfb-run -a pnpm nx run @agimon-ai/doompi-desktop:test:e2e

      - name: Keep the traces of a failed run
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-desktop
          path: |
            packages/clients/doompi-desktop/playwright-report
            packages/clients/doompi-desktop/test-results
          retention-days: 7
  # Packed-install gate: packs and installs every package for real, checks the
  # frozen published compatibility baseline, then asserts startup latency.
  #
  # The CLI system suites are split by top-level suite across disposable hosted
  # runners. Each runner keeps Vitest file execution serial because the tests
  # launch real processes and use shared resources within that runner.
  installed_runtime_shards:
    name: Installed runtime (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: CLI system tests (1/6)
            project: "@agimon-ai/doompi"
            shard: "1"
            check: true
          - name: CLI system tests (2/6)
            project: "@agimon-ai/doompi"
            shard: "2"
            check: false
          - name: CLI system tests (3/6)
            project: "@agimon-ai/doompi"
            shard: "3"
            check: false
          - name: CLI system tests (4/6)
            project: "@agimon-ai/doompi"
            shard: "4"
            check: false
          - name: CLI system tests (5/6)
            project: "@agimon-ai/doompi"
            shard: "5"
            check: false
          - name: CLI system tests (6/6)
            project: "@agimon-ai/doompi"
            shard: "6"
            check: false
          - name: Team system tests
            project: "@agimon-ai/doompi-team"
            shard: ""
            check: false
    steps:
      - name: Check out materialized package snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up DoomPi workspace
        uses: ./.github/actions/setup-monorepo

      - name: Verify Runner native payloads
        run: pnpm runner:check

      - name: Audit ownership and dependency boundaries
        run: pnpm audit:workspace

      - name: Build package matrix
        run: pnpm build

      - name: Verify system-test shard coverage
        if: matrix.check
        run: node scripts/check-system-test-shards.mjs

      - name: Pack, install, and test the runtime
        env:
          DOOMPI_SYSTEM_SHARD: ${{ matrix.shard }}
          DOOMPI_SYSTEM_TIMING_FILE: ${{ runner.temp }}/doompi-system-timing.json
        run: |
          set +e
          pnpm nx run "${{ matrix.project }}:test-system"
          status=$?
          if [[ -f "${DOOMPI_SYSTEM_TIMING_FILE}" ]]; then cat "${DOOMPI_SYSTEM_TIMING_FILE}"; fi
          exit "${status}"

  # Keep one stable required check while the execution matrix evolves.
  installed-runtime:
    if: always()
    needs: installed_runtime_shards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every installed-runtime shard to pass
        env:
          SHARDS_RESULT: ${{ needs.installed_runtime_shards.result }}
        run: |
          if [[ "$SHARDS_RESULT" != "success" ]]; then
            printf 'An installed-runtime shard finished with result: %s\n' "$SHARDS_RESULT"
            exit 1
          fi
