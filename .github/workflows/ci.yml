name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job runs on a GitHub-hosted runner.
#
# A pull request from a fork is untrusted code, and this workspace runs install
# scripts (the root `prepare` builds the vibe-lint plugin) before any check has
# had a chance to look at the diff. On a public repository that is arbitrary
# execution on whatever machine picks the job up, so it must not be ours. A
# disposable hosted runner satisfies that for every trigger, not just forks.

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out materialized package snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up DoomPi workspace
        uses: ./.github/actions/setup-monorepo

      - name: Verify Runner native payloads
        run: pnpm runner:check

      - name: Audit ownership and dependency boundaries
        run: pnpm audit:workspace

      - name: Check formatting
        run: pnpm fmt:check

      - name: Check generated hook settings
        run: pnpm hooks:check

      - name: Build packages
        run: pnpm nx run-many -t build --parallel=3

      - name: Validate plugin and workflow examples
        run: pnpm examples:check

      - name: Lint packages
        run: pnpm nx run-many -t lint --parallel=3

      - name: Run deterministic Vibe-Lint review
        run: pnpm lint:vibe --preflight-only

      - name: Type-check packages
        run: pnpm nx run-many -t typecheck --parallel=3

      - name: Test packages
        run: pnpm nx run-many -t test --parallel=1

  # Browser gate for the cockpit.
  #
  # Package tests render every plugin component to static markup, which proves
  # they mount and read the props the host sends. What they cannot reach is a
  # click, an effect, or a Radix portal, so the specs here are the only thing
  # that exercises the cockpit as a running program: sessions, the transcript,
  # dialogs, leader keys, and the plugin tabs.
  #
  # It runs on pull requests for the reason the packed-install gate below
  # already records: a gate that only runs after merge lets regressions through
  # review. The bundle it serves is built by the same code path `doompi sync`
  # runs, over every plugin package found by walking the workspace.
  browser:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out materialized package snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up DoomPi workspace
        uses: ./.github/actions/setup-monorepo

      - name: Build the cockpit and the servers it spawns
        run: pnpm cockpit:build

      - name: Install the Chromium the suite drives
        run: pnpm --filter @agimon-ai/doompi-web exec playwright install --with-deps chromium

      - name: Drive the cockpit in a browser
        run: pnpm nx run @agimon-ai/doompi-web:test:e2e

      - name: Keep the traces of a failed run
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            packages/clients/doompi-web/playwright-report
            packages/clients/doompi-web/test-results
          retention-days: 7

  # Packed-install gate: packs and installs every package for real, checks the
  # frozen published compatibility baseline, then asserts startup latency.
  #
  # It runs on pull requests, not only on pushes. It was push-only while it
  # needed a machine of ours, and the cost showed: an export added to the
  # contracts package went unrecorded through review and only failed after it
  # reached main, because nothing ran this gate before the merge.
  #
  # The latency assertions compare measurements from one machine, so a
  # uniformly slower runner cancels out, but a noisy shared one may not. Watch
  # for flakiness before trusting a failure here, and prefer giving the parity
  # comparison its own allowance over widening the shared jitter again.
  installed-runtime:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out materialized package snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up DoomPi workspace
        uses: ./.github/actions/setup-monorepo

      - name: Verify Runner native payloads
        run: pnpm runner:check

      - name: Audit ownership and dependency boundaries
        run: pnpm audit:workspace

      - name: Build package matrix
        run: pnpm build

      - name: Pack, install, and test the runtime
        run: pnpm nx run-many -t test-system --parallel=1
