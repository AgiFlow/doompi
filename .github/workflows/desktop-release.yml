name: Desktop package check

# This manual workflow checks platform packaging only. The local
# `scripts/release-desktop.mjs` flow owns signed nightly GitHub releases.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doompi-desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: mac
            target: darwin-arm64
          - runner: ubuntu-latest
            platform: linux
            target: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux
            target: linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.3.4

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
          cache: pnpm

      - name: Confirm package target
        run: |
          actual="$(node -p 'process.platform + "-" + process.arch')"
          test "$actual" = "${{ matrix.target }}"

      - name: Install frozen registry and workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the workspace packages the app bundles
        run: pnpm nx run-many -t build -p @agimon-ai/doompi-web @agimon-ai/doompi-desktop

      - name: Require macOS signing credentials
        if: matrix.platform == 'mac'
        env:
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          CSC_NAME: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          test -n "$CSC_LINK"
          test -n "$CSC_KEY_PASSWORD"
          test -n "$CSC_NAME"
          test -n "$APPLE_ID"
          test -n "$APPLE_APP_SPECIFIC_PASSWORD"
          test -n "$APPLE_TEAM_ID"

      - name: Package the desktop app
        run: pnpm nx run @agimon-ai/doompi-desktop:package
        env:
          # Linux remains unsigned. macOS packaging fails closed when any signing
          # or notarization input is absent.
          DOOMPI_DESKTOP_REQUIRE_SIGNING: ${{ matrix.platform == 'mac' && '1' || '0' }}
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          CSC_NAME: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Confirm macOS artifacts are notarized
        if: matrix.platform == 'mac'
        run: |
          app="packages/clients/doompi-desktop/release/mac-arm64/DoomPi.app"
          codesign -dv --verbose=4 "$app"
          spctl -a -vvv -t install "$app"
