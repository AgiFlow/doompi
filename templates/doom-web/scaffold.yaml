boilerplate:
  - name: scaffold-doom-web
    targetFolder: packages/clients
    description: |-
      Create a publishable DoomPi browser client: a presentation-only HTTP server that serves the browser shell and proxies `/api` HTTP and `/api/pi` WebSocket traffic to a client-neutral headless process.

      The generated package owns browser assets, PWA delivery, browser plugin bundling, and the development server. Session state, server facets, package APIs, channels, authorization, history, replay, and process lifetimes stay in `doompi-server`; this package does not poll sessions, launch servers, attach to internal sockets, or load server-side plugin APIs.
    variables_schema:
      type: object
      properties:
        packageName:
          type: string
          description: Unscoped npm package name, also the executable name
          pattern: "^doompi-[a-z0-9]+(-[a-z0-9]+)*$"
          minLength: 8
          maxLength: 58
          example: doompi-web
        packageDescription:
          type: string
          description: Public npm package description; quotes, backslashes, and newlines are rejected so generated JSON stays valid
          pattern: "^[A-Za-z0-9][A-Za-z0-9 .,;:!?()/-]*$"
          minLength: 1
          maxLength: 240
          example: Web cockpit for DoomPi sessions
        packageKeyword:
          type: string
          description: Lowercase capability-specific npm search keyword
          pattern: "^[a-z][a-z0-9]*(-[a-z0-9]+)*$"
          minLength: 2
          maxLength: 40
          example: session-console
        author:
          type: string
          description: Package author and copyright holder
          pattern: "^[A-Za-z0-9][A-Za-z0-9 .,'()-]*$"
          minLength: 1
          maxLength: 120
          default: Vuong Ngo
          example: Vuong Ngo
        copyrightYear:
          type: string
          description: Year recorded in the LICENSE copyright line
          pattern: "^[0-9]{4}$"
          default: "2026"
          example: "2026"
      required:
        - packageName
        - packageDescription
        - packageKeyword
      additionalProperties: false
