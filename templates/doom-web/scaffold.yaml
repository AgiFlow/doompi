    instruction: |-
      Verify the generated presentation package before changing it:
      - `pnpm install` at the repository root, then `pnpm build` in the package. The build order matters: tsdown cleans dist, so the server is built before Vite writes the browser bundles.
      - `pnpm test` for the Vitest suites and `pnpm typecheck` for browser and server contracts.

      Keep the presentation boundary small. `src/adapters/httpServer.ts` serves browser assets and forwards `/api` HTTP requests plus the `/api/pi` WebSocket to the configured headless endpoint. It must not interpret frames, discover sessions, start processes, open internal sockets, or load server facets. `src/bin/serve.ts` only parses presentation and upstream options and starts this proxy.

      The browser imports shared wire contracts and owns rendering, navigation, and client state. The headless process owns sessions, server facets, APIs, channels, authorization, history, and replay. Keep server access under `src/adapters`; keep browser-only code under `src/web`; never make a browser feature depend on a server module.

      Browser plugins use `doompiWeb.client`. Host-side behavior uses `doompiServer` and is loaded by `doompi-server`, never by this package. The web bundler composes browser entries only, while Vite's `/api` proxy points at the headless endpoint.

feature:
  - name: scaffold-doom-web-feature
    description: |-
      Add a browser feature slice to a DoomPi web package: a folder under src/web/features owning its components and any state it needs, plus focused browser coverage.

      Use it when a new browser surface reads or writes session state. Do not use it for a shared primitive; those belong in src/web/components.
    variables_schema:
      type: object
      properties:
        featureName:
          type: string
          description: Feature folder name in kebab-case
          pattern: "^[a-z][a-z0-9]*(-[a-z0-9]+)*$"
          minLength: 2
          maxLength: 40
          example: activity
        componentName:
          type: string
          description: Root component name in PascalCase
          pattern: "^[A-Z][A-Za-z0-9]*$"
          minLength: 2
          maxLength: 60
          example: ActivityDock
      required:
        - featureName
        - componentName
      additionalProperties: false
    includes:
      - src/web/features/session/Timeline.tsx->src/web/features/{{ featureName }}/{{ componentName }}.tsx
    instruction: |-
      Replace the copied bodies; they are there to show the shape, not to be kept.

      The component reads browser state with `useStore` from the stores layer and sends protocol commands through the existing transport actions. It must not import another feature or open its own socket: the application root owns the `/api/pi` connection.

      Keep the feature presentation-only. Do not add session discovery, process management, filesystem access, internal sockets, or server-facet loading to the browser package. Emit protocol frames from the headless endpoint in browser tests, then assert on `data-testid` hooks.

      Anything the slice renders must come from a frame the headless endpoint actually sends. If the protocol has no source for it, say so instead of rendering a placeholder value.
    patterns:
      - src/web/features/**/*.tsx
