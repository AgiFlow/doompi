boilerplate:
  - name: scaffold-doom-web
    targetFolder: packages/clients
    description: |-
      Create a publishable DoomPi web package: a Hono executable hosting a multi-session cockpit hub that discovers running doompi-server sessions through the registry directory, multiplexes their authenticated sockets behind one page WebSocket, and serves a React cockpit built by Vite.

      The generated package boots against real sessions on the first run. It ships the session hub (registry watcher, one socket attachment per session, a bounded replay ring, presence derivation, a spawner for sessions created from the page), the frame reducer, a feature-sliced client (sessions rail, session timeline and composer, subagents fleet grid, status rail, extension-UI dialogs, command palette) with a build-time web plugin system that assembles tabs and data channels from doompiWeb manifests across the workspace, and the test pyramid that covers them: vitest unit and integration suites plus Playwright end-to-end specs driving the built executable against scripted session sockets.

      Use it for any browser surface that attaches to supervised Pi sessions. It registers no Pi extension and is not part of a mode; it is a standalone executable, or the process doompi-server --web starts.
    variables_schema:
      type: object
      properties:
        packageName:
          type: string
          description: Unscoped npm package name, also the executable name
          pattern: "^doompi-[a-z0-9]+(-[a-z0-9]+)*$"
          minLength: 8
          maxLength: 58
          example: doompi-web
        packageDescription:
          type: string
          description: Public npm package description; quotes, backslashes, and newlines are rejected so generated JSON stays valid
          pattern: "^[A-Za-z0-9][A-Za-z0-9 .,;:!?()/-]*$"
          minLength: 1
          maxLength: 240
          example: Web cockpit for DoomPi sessions
        packageKeyword:
          type: string
          description: Lowercase capability-specific npm search keyword
          pattern: "^[a-z][a-z0-9]*(-[a-z0-9]+)*$"
          minLength: 2
          maxLength: 40
          example: session-console
        author:
          type: string
          description: Package author and copyright holder
          pattern: "^[A-Za-z0-9][A-Za-z0-9 .,'()-]*$"
          minLength: 1
          maxLength: 120
          default: Vuong Ngo
          example: Vuong Ngo
        copyrightYear:
          type: string
          description: Year recorded in the LICENSE copyright line
          pattern: "^[0-9]{4}$"
          default: "2026"
          example: "2026"
      required:
        - packageName
        - packageDescription
        - packageKeyword
      additionalProperties: false
