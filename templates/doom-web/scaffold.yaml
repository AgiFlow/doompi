      - vite.config.ts
      - vitest.config.ts
    instruction: |-
      The generated package already runs. Verify it before changing anything:
      - `pnpm install` at the repository root, then `pnpm build` in the package. The build order matters: tsdown cleans dist, so the server is built before Vite writes dist/web.
      - `pnpm test` for the vitest suites, then `pnpm exec playwright install chromium` once and `pnpm test:e2e` for the browser suites.

      Respect the two import graphs; the doom-web vibe-lint preset enforces them.
      - Server: src/types then src/services then src/adapters then src/bin, with src/exports free to import any of them. Socket, HTTP, and process access belongs in src/adapters, never in src/services.
      - Client, under src/web: types then lib then stores then components then features then routes then app. One feature must not import another; lift shared code into components, lib, or stores.
      - src/types is the only module both sides may import. Nothing under src/web may reach the server layers.

      The cockpit is multi-session. The hub in src/adapters/sessionHub.ts holds one socket attachment per registered session and every page-facing frame is enveloped by session id (src/types/hub.ts is that contract). On the client, session-scoped state lives in per-session stores keyed by session id (src/web/stores/sessionStore.ts is a registry, src/web/stores/sessionsStore.ts holds the rail), the active session is the route param, and store actions default to the focused session.

      Render only what the session reports. Pi's RPC protocol is the single source of truth, so add a frame to the reducer in src/web/lib/sessionModel.ts before rendering it, and leave a surface out rather than inventing a value the agent never sent. The rail renders from hub summaries alone; if a fact is not in SessionSummary, derive it in src/services/sessionPresence.ts before showing it.

      Tabs beyond the conversation are web plugins, and no plugin package is ever a dependency of this one. A plugin declares a doompiWeb block in its package.json (client entry, optional hub entry with its built dist, channels); the package's own build only regenerates the committed builtin registry from its own manifest (src/adapters/webPluginGenerate.ts at config-load of vite.config.ts and tsdown.config.ts, checked in CI and by tests/contract/webPluginRegistry.test.ts). The full plugin set is assembled later, on the user's machine: doompi sync scans the installed composition's package roots, generates the entry modules, and runs the ./bundler subpath (src/adapters/webBundler.ts) to rebuild the SPA into ~/.doompi/web/current, which serveWeb prefers over the packaged bundle; the bundle carries webPlugins.server.json naming each plugin's built hub entry, which the hub imports lazily so an absent package is a notice and an empty tab, never a crash. No plugin ships in this package: the reference plugins are @agimon-ai/doompi-team (subagents tab, channel, and activity group) and @agimon-ai/doompi-workflow (workflows tab, channel, minor mode, and activity group); the minor-mode packages show the metadata-only shape.

feature:
  - name: scaffold-doom-web-feature
    description: |-
      Add a feature slice to a DoomPi web package: a folder under src/web/features owning its components and any state it needs, plus a Playwright spec that drives it end to end.

      Use it when a new browser surface reads or writes session state. Do not use it for a shared primitive; those belong in src/web/components.
    variables_schema:
      type: object
      properties:
        featureName:
          type: string
          description: Feature folder name in kebab-case
          pattern: "^[a-z][a-z0-9]*(-[a-z0-9]+)*$"
          minLength: 2
          maxLength: 40
          example: activity
        componentName:
          type: string
          description: Root component name in PascalCase
          pattern: "^[A-Z][A-Za-z0-9]*$"
          minLength: 2
          maxLength: 60
          example: ActivityDock
      required:
        - featureName
        - componentName
      additionalProperties: false
    includes:
      - src/web/features/session/Timeline.tsx->src/web/features/{{ featureName }}/{{ componentName }}.tsx
      - tests/e2e/session.spec.ts->tests/e2e/{{ featureName }}.spec.ts
    instruction: |-
      Replace the copied bodies; they are there to show the shape, not to be kept.

      The component reads state with `useStore` from the stores layer and sends commands through the exported action functions. It must not import another feature, and it must not open its own socket: the composition root owns the transport.

      The spec uses the `cockpit` fixture, which spawns the built executable against a scripted session socket. Emit the frames the real agent would emit, then assert on `data-testid` hooks; add a hook rather than matching on styling or copy.

      Anything the slice renders must come from a frame the session actually sends. If Pi's RPC protocol has no source for it, say so instead of rendering a placeholder value.
    patterns:
      - src/web/features/**/*.tsx
      - tests/e2e/**/*.spec.ts
