boilerplate:
  - name: scaffold-doom-extension
    targetFolder: packages/default
    description: |-
      Create a publishable Pi extension package for the DoomPi distribution using the repository's canonical KISS service-layer structure.
      The generated package uses plain factory dependency injection, a thin standalone Pi entrypoint, deterministic lifecycle cleanup, strict TypeScript, dual ESM/CJS output, and portable Vibe-Lint boundaries.
    variables_schema:
      type: object
      properties:
        packageName:
          type: string
          description: Publishable package folder/name without the @agimon-ai scope (doompi-* in kebab-case)
          pattern: "^doompi-[a-z][a-z0-9]*(-[a-z0-9]+)*$"
          maxLength: 58
          example: doompi-log
        packageDescription:
          type: string
          description: Public npm package description; quotes, backslashes, and newlines are rejected so generated JSON stays valid
          pattern: "^[A-Za-z0-9][A-Za-z0-9 .,;:!?()/-]*$"
          minLength: 1
          maxLength: 240
          example: Session metrics for DoomPi
        packageKeyword:
          type: string
          description: Lowercase capability-specific npm search keyword
          pattern: "^[a-z][a-z0-9]*(-[a-z0-9]+)*$"
          minLength: 2
          maxLength: 40
          example: session-metrics
        commandName:
          type: string
          description: Pi command name without the leading slash
          pattern: "^[a-z][a-z0-9]*(-[a-z0-9]+)*$"
          example: doom-log
        commandDescription:
          type: string
          description: Command help text and default service response
          pattern: "^[A-Za-z0-9][A-Za-z0-9 .,;:!?()/-]*$"
          minLength: 1
          example: Show session metrics
        author:
          type: string
          description: Package author and copyright holder
          pattern: "^[A-Za-z0-9][A-Za-z0-9 .,'()-]*$"
          minLength: 1
          maxLength: 120
          default: Vuong Ngo
          example: Vuong Ngo
        copyrightYear:
          type: string
          description: Year recorded in the LICENSE copyright line
          pattern: "^[0-9]{4}$"
          default: "2026"
          example: "2026"
      required:
        - packageName
        - packageDescription
        - packageKeyword
        - commandName
        - commandDescription
      additionalProperties: false
    includes:
      - .oxlintrc.json
      - LICENSE
      - README.md
      - llms.txt
      - package.json
      - project.json
      - tsconfig.json
      - tsdown.config.ts
      - vitest.config.ts
      - vibe-lint.config.yaml
      - src/exports/index.ts
      - src/types/extension.ts
      - src/services/extensionService.ts
      - src/container/index.ts
      - src/commands/command.ts->src/commands/{{ commandName | camelCase }}Command.ts
      - 'src/prompts/use/SKILL.md->src/prompts/doompi-use-{{ packageName | replace: "doompi-", "" | kebabCase }}/SKILL.md'
      - src/exports/extensions/pi.ts
      - src/adapters/pi/extension.ts
      - tests/unit/services/extensionService.test.ts
      - tests/integration/extensions/pi.test.ts
      - tests/contract/packageShape.test.ts
    instruction: |-
      Generate the minimum canonical DoomPi extension. The executable source vocabulary is fixed: types, schemas, services, adapters, providers, container, commands, tui, and bin, with src/exports as the only public surface. Package-owned Help resources live under src/prompts. Omit unused folders; do not introduce alternate architecture roots.

      File responsibilities:
      - src/exports/: The only public surface. One pure re-export file per package.json exports subpath, mirroring the subpath tree. No src/index.ts.
      - src/types/: Ports and domain contracts, owned by the core. A port is the interface the package needs, named in the package's own vocabulary; the adapter that satisfies it lives elsewhere and imports it from here. Never declare a port beside its implementation, or services can no longer depend on the capability at all.
      - src/schemas/: Runtime TypeBox or Zod validation contracts.
      - src/services/: Host-neutral business behavior, flat. The package already names its subject, so do not add a src/services/<subject> folder; group only where two or more domains need telling apart. A service is a function of its arguments: it may import types and schemas, never Pi, Node builtins, TUI, containers, or concrete adapters, and it must not read Date.now(), Math.random(), timers or process.* ambiently. Take a clock, an id factory or the environment as a parameter.
      - src/providers/: Cordis Services published on the shared Context for other extensions to consume. Extend Service and call super(ctx, name).
      - src/adapters/: Implementations of the ports declared in src/types, one per technology. This is where the filesystem, processes, the network, the clock and the Pi host API enter. src/adapters/pi connects to the shared Doom Cordis host, mounts one package-owned plugin fiber, and disposes that fiber before releasing its host lease on session_shutdown. Never construct a package-local Cordis Context.
      - src/container/index.ts: Plain factory dependency construction and test overrides. Use @deepseek-ai/cordis, never inversify.
      - src/commands/: Pi command translation; invoke injected service contracts and map results to UI.
      - src/prompts/: Package-owned Help resources. Each direct child is a kebab-case skill directory containing SKILL.md. Prompts are published as source resources, linked from llms.txt, and registered through optional Cordis Help injection. Do not export them or copy them into dist.
      - llms.txt: Concise H1-led package Help index whose relative links resolve to explicitly shipped resources and route to every package prompt.

      Run pnpm fixcode in the generated package before the first lint. Rendered names change line widths, so a template signature that wraps in the source can render as a single line the formatter wants joined.

      Pi packages use version 0.84.3 exactly. The packageKeyword value must name the extension's real user-facing capability rather than repeat a generic shared keyword. Keep package exports closed and explicit. Run build, typecheck, test, lint, Vibe-Lint preflight, and npm pack --dry-run before publishing.

      A cockpit (web) presence is not generated here; add it with the scaffold-doom-web-plugin feature, then one scaffold-doom-web-tool-card per Pi tool the package registers. It lives in web/, outside the src vocabulary, and is governed by the web-plugin-* rules.
features:
  - name: scaffold-doom-prompt
    description: Add one package-owned DoomPi Help prompt under src/prompts for either extension authoring or user guidance.
    variables_schema:
      type: object
      properties:
        promptName:
          type: string
          description: Help skill name beginning with doompi-author- or doompi-use-
          pattern: "^doompi-(author|use)-[a-z][a-z0-9]*(-[a-z0-9]+)*$"
          maxLength: 64
          example: doompi-use-log
        promptDescription:
          type: string
          description: Concise discovery description explaining what the prompt helps with and when it applies
          pattern: "^[A-Za-z0-9][A-Za-z0-9 .,;:!?()/@-]*$"
          minLength: 1
          maxLength: 480
          example: Use DoomPi Log to inspect structured session diagnostics
      required:
        - promptName
        - promptDescription
      additionalProperties: false
    includes:
      - src/prompts/prompt/SKILL.md->src/prompts/{{ promptName | kebabCase }}/SKILL.md
    instruction: |-
      Generate one package-owned Help prompt at src/prompts/{{ promptName | kebabCase }}/SKILL.md. Keep its instructions specific to the owning package and put substantial conditional detail in references only when needed.

      Complete the package integration after generation:
      - Link the prompt from the matching How to author or How to use section in llms.txt.
      - Register a descriptor with the exact same name and description through an optional cordis.inject([DOOM_HELP_SERVICE], ...) binding in the Pi adapter. Use the package name as source, import.meta.url as moduleUrl, and return the contribution disposer.
      - Ensure package.json publishes the exact src/prompts directory. Do not add an export, build entry, or dist copy for Markdown prompts.
      - Validate the new skill and run the package contract, integration, lint, typecheck, and build targets.
    patterns:
      - src/prompts/**/*.md
  - name: scaffold-doom-service
    description: Add one host-neutral service under src/services with its unit test.
    variables_schema:
      type: object
      properties:
        serviceName:
          type: string
          description: camelCase service module and function name
          pattern: "^[a-z][a-zA-Z0-9]*$"
          maxLength: 48
          example: idlePolicy
        serviceDescription:
          type: string
          description: What the service decides or derives, in one line
          pattern: "^[A-Za-z0-9][A-Za-z0-9 .,;:!?()/-]*$"
          minLength: 1
          maxLength: 240
          example: Decide whether an idle session should stop
      required:
        - serviceName
        - serviceDescription
      additionalProperties: false
    includes:
      - src/services/service.ts->src/services/{{ serviceName | camelCase }}.ts
      - tests/unit/services/service.test.ts->tests/unit/services/{{ serviceName | camelCase }}.test.ts
    instruction: |-
      Generate one host-neutral service at src/services/{{ serviceName | camelCase }}.ts. Keep src/services flat; the package already names its subject, so add a subfolder only when two or more domains need telling apart.

      The service is a function of its arguments. It may import src/types and src/schemas, never Pi, node builtins, TUI, containers, or concrete adapters, and it must not read Date.now(), Math.random(), timers, or process.* ambiently. Take the clock, id factory, or environment as a parameter so the unit test stays deterministic.

      Complete the package integration after generation:
      - Replace the placeholder input, result, and body with the real contract; do not keep the generated shape.
      - Re-export from src/exports/index.ts only if the service is part of the package's public surface.
      - Run pnpm fixcode, then the package lint, typecheck, test, and build targets.
    patterns:
      - src/services/**/*.ts
  - name: scaffold-doom-command
    description: Add one Pi command under src/commands with its integration test.
    variables_schema:
      type: object
      properties:
        commandName:
          type: string
          description: Pi command name without the leading slash
          pattern: "^[a-z][a-z0-9]*(-[a-z0-9]+)*$"
          maxLength: 48
          example: doom-log
        commandDescription:
          type: string
          description: Command help text shown in the Pi command list
          pattern: "^[A-Za-z0-9][A-Za-z0-9 .,;:!?()/-]*$"
          minLength: 1
          maxLength: 240
          example: Show session metrics
      required:
        - commandName
        - commandDescription
      additionalProperties: false
    includes:
      - src/commands/featureCommand.ts->src/commands/{{ commandName | camelCase }}Command.ts
      - tests/integration/commands/featureCommand.test.ts->tests/integration/commands/{{ commandName | camelCase }}Command.test.ts
    instruction: |-
      Generate one Pi command at src/commands/{{ commandName | camelCase }}Command.ts. Commands are a translation layer only: invoke an injected contract and map its result to the UI. Business behavior belongs in src/services.

      Complete the package integration after generation:
      - Call register{{ commandName | pascalCase }}Command from the package's Pi adapter, inside the plugin fiber, passing dependencies built by src/container/index.ts. Do not construct the dependency inline.
      - Guard every UI call with ctx.hasUI so the command stays headless-safe, and check ctx.mode when it needs the TUI.
      - Document the command under the README Use section.
      - Run pnpm fixcode, then the package lint, typecheck, test, and build targets.
    patterns:
      - src/commands/**/*.ts
  - name: scaffold-doom-provider
    description: Add one Cordis provider under src/providers that publishes a service on the shared Context.
    variables_schema:
      type: object
      properties:
        providerName:
          type: string
          description: kebab-case capability name, used for the class name and the doom/ service key
          pattern: "^[a-z][a-z0-9]*(-[a-z0-9]+)*$"
          maxLength: 48
          example: session-metrics
        providerDescription:
          type: string
          description: What the provider publishes for other extensions to consume
          pattern: "^[A-Za-z0-9][A-Za-z0-9 .,;:!?()/-]*$"
          minLength: 1
          maxLength: 240
          example: Publish session metrics for other extensions to read
      required:
        - providerName
        - providerDescription
      additionalProperties: false
    includes:
      - src/providers/provider.ts->src/providers/{{ providerName | camelCase }}.ts
    instruction: |-
      Generate one Cordis provider at src/providers/{{ providerName | camelCase }}.ts. A provider is the package's contribution to the shared Doom Context: it extends Service, calls super(context, key), and is what other extensions inject rather than importing across packages.

      Complete the package integration after generation:
      - Construct the service inside the package's own plugin fiber in src/adapters/pi, never on a package-local Context, so host disposal unwinds it.
      - Keep the declare module augmentation key identical to the exported service key string.
      - Consumers read it through cordis.inject or the generated read{{ providerName | pascalCase }} helper and must tolerate undefined; a provider is optional until some extension mounts it.
      - Export the service, its key, and its snapshot type from src/exports/index.ts if other packages consume them.
      - Run pnpm fixcode, then the package lint, typecheck, test, and build targets.
    patterns:
      - src/providers/**/*.ts
  - name: scaffold-doom-adapter
    description: Add one port under src/types and the adapter under src/adapters that implements it, with a unit test.
    variables_schema:
      type: object
      properties:
        capabilityName:
          type: string
          description: camelCase capability the port names, in the package's own vocabulary
          pattern: "^[a-z][a-zA-Z0-9]*$"
          maxLength: 48
          example: clock
        adapterName:
          type: string
          description: camelCase technology that satisfies the port, used as the src/adapters subfolder
          pattern: "^[a-z][a-zA-Z0-9]*$"
          maxLength: 48
          example: node
        capabilityDescription:
          type: string
          description: What the capability provides, in one line
          pattern: "^[A-Za-z0-9][A-Za-z0-9 .,;:!?()/-]*$"
          minLength: 1
          maxLength: 240
          example: Read the current wall clock time
      required:
        - capabilityName
        - adapterName
        - capabilityDescription
      additionalProperties: false
    includes:
      - src/types/port.ts->src/types/{{ capabilityName | camelCase }}.ts
      - src/adapters/adapter/adapter.ts->src/adapters/{{ adapterName | camelCase }}/{{ capabilityName | camelCase }}.ts
      - tests/unit/adapters/adapter.test.ts->tests/unit/adapters/{{ capabilityName | camelCase }}.test.ts
    instruction: |-
      Generate the {{ capabilityName | pascalCase }}Port in src/types and one {{ adapterName | camelCase }} implementation of it in src/adapters. The dependency points inward: the port is named in the package's vocabulary and the adapter imports it, never the reverse.

      If src/types/{{ capabilityName | camelCase }}.ts already exists, keep the existing port, delete the generated one, and point the adapter import at it rather than declaring a second contract.

      Complete the package integration after generation:
      - Replace the placeholder read() signature with the real contract before writing the implementation.
      - Wire the adapter through src/container/index.ts so services receive the port and tests can override it.
      - Keep filesystem, process, network, clock, and Pi host access inside this folder; services must keep importing only the port.
      - Run pnpm fixcode, then the package lint, typecheck, test, and build targets.
    patterns:
      - src/adapters/**/*.ts
      - src/types/**/*.ts
  - name: scaffold-doom-package-api
    description: Add this package's HTTP API, served by the session's own doompi-server, by the cockpit hub, or by both, with its shared route vocabulary and a unit test.
    variables_schema:
      type: object
      properties:
        pluginId:
          type: string
          description: The kebab-case base path the API is mounted under, /api/plugin/<pluginId>; unique across every installed package
          pattern: "^[a-z][a-z0-9]*(-[a-z0-9]+)*$"
          maxLength: 48
          example: runner
        topic:
          type: string
          description: camelCase stem for the adapter, the route vocabulary module, and the view types
          pattern: "^[a-z][a-zA-Z0-9]*$"
          maxLength: 48
          example: runner
      required:
        - pluginId
        - topic
      additionalProperties: false
    includes:
      - src/types/topicApi.ts->src/types/{{ topic | camelCase }}Api.ts
      - src/adapters/topicApi.ts->src/adapters/{{ topic | camelCase }}Api.ts
      - src/exports/sessionApi.ts
      - tests/unit/topicApi.test.ts->tests/unit/{{ topic | camelCase }}Api.test.ts
    instruction: |-
      Generate the package's HTTP API: src/types/{{ topic | camelCase }}Api.ts with the base path, the route paths, and the view types both halves share; src/adapters/{{ topic | camelCase }}Api.ts with the Hono app and the `api` export; src/exports/sessionApi.ts as the built entry a host imports.

      The rules: a host mounts the API under /api/plugin/{{ pluginId }} and strips that prefix, so routes are declared relative and nothing repeats the mount. The scope decides the host: a session-scoped API is served by that session's own doompi-server and its context names the session; a hub-scoped one is served by the cockpit hub and names none. Keep the adapter free of ambient filesystem, clock, and process access the way every other adapter here is: take those as options. Route paths and query building live in src/types so the browser half can import them; a page never appends its own query to a URL this module built.

      Complete the package integration after generation:
      - Add the doompiApi block to package.json: basePath "{{ pluginId }}", and the scopes this package serves. Use session { entry "./src/exports/sessionApi.ts", dist "./dist/sessionApi.mjs" } for per-session data, hub { entry "./src/exports/hubApi.ts", dist "./dist/hubApi.mjs" } for machine-wide data, or both. Only declare a scope the package actually serves.
      - Add a "./session-api" export pointing at dist/sessionApi.d.mts, dist/sessionApi.mjs, dist/sessionApi.cjs (tsdown builds it from src/exports), and the matching subpath for any hub entry.
      - Add hono and @agimon-ai/doompi-extension-contracts (workspace:*) to dependencies.
      - `doompi sync` generates the route modules a host imports, so a package that changed its API needs a build and a sync before a host sees it; a running host imports the built entry, never the source.
      - Run pnpm fixcode, then lint, typecheck, test, build, and pnpm vibe-lint check --preflight-only on src/types, src/adapters, src/exports, and package.json.
    patterns:
      - src/types/*Api.ts
      - src/adapters/*Api.ts
      - src/exports/sessionApi.ts
      - src/exports/hubApi.ts
  - name: scaffold-doom-web-plugin
    description: Add this package's cockpit (web) plugin under web/ with its per-session store, hub data channel, shared view types, and store test.
    variables_schema:
      type: object
      properties:
        pluginId:
          type: string
          description: The kebab-case web plugin id, also the tab id and URL segment; unique across every installed plugin
          pattern: "^[a-z][a-z0-9]*(-[a-z0-9]+)*$"
          maxLength: 48
          example: runners
        topic:
          type: string
          description: camelCase stem for the store, panel, view types, and channel module names
          pattern: "^[a-z][a-zA-Z0-9]*$"
          maxLength: 48
          example: runners
        channelName:
          type: string
          description: The snake_case wire frame type the hub publishes and the plugin claims; unique across every installed plugin
          pattern: "^[a-z][a-z0-9]*(_[a-z0-9]+)*$"
          maxLength: 48
          example: runner_runs
      required:
        - pluginId
        - topic
        - channelName
      additionalProperties: false
    includes:
      - web/index.ts
      - web/topicStore.ts->web/{{ topic | camelCase }}Store.ts
      - web/TopicPanel.tsx->web/{{ topic | pascalCase }}Panel.tsx
      - web/tsconfig.json
      - src/types/webTopic.ts->src/types/web{{ topic | pascalCase }}.ts
      - src/adapters/webTopicChannel.ts->src/adapters/web{{ topic | pascalCase }}Channel.ts
      - src/exports/webHub.ts
      - tests/unit/webTopicStore.test.ts->tests/unit/web{{ topic | pascalCase }}Store.test.ts
    instruction: |-
      Generate the package's cockpit plugin: web/index.ts exporting webPlugin through defineWebPlugin, web/{{ topic | camelCase }}Store.ts holding the per-session record through defineSessionStore with its channel, web/{{ topic | pascalCase }}Panel.tsx as the tab, src/types/web{{ topic | pascalCase }}.ts with the wire-JSON view types both halves share, src/adapters/web{{ topic | pascalCase }}Channel.ts as the hub's data source, and src/exports/webHub.ts as the built hub entry.

      The rules: the store record is the whole per-session state (the hub's last payload plus this page's ephemeral state), components read it with useStore over the store's select and act through props.sendSessionFrame, tool cards receive the session statuses as props, and no web/ module keeps a top-level let. web/ may import only react, @tanstack/store, @tanstack/react-store, @agimon-ai/doompi-web-contracts, @agimon-ai/doompi-web-components, its own web/** and src/types/**; plugins never import each other. Plugins are independent: open a slot with slots: [defineSlot({ slot: '{{ pluginId }}.<name>' })] and render it with props.renderSlot; fill another plugin's or the host's slot with fills; every relation resolves by name after install, so never depend on order, and a collision is an install diagnostic, not a failure.

      Complete the package integration after generation:
      - Add the doompiWeb block to package.json: pluginId "{{ pluginId }}", channels ["{{ channelName }}"], client "./web/index.ts", hub { entry "./src/exports/webHub.ts", dist "./dist/webHub.mjs" }, and registrationOrder only if this plugin must install before or after another for a tool matcher or start hook (it is an optional tiebreak, default 1000).
      - Add "web" and "src/types/web{{ topic | pascalCase }}.ts" to the files allowlist, and a "./web-hub" export pointing at dist/webHub.d.mts, dist/webHub.mjs, dist/webHub.cjs (tsdown builds it from src/exports).
      - Add @agimon-ai/doompi-web-contracts and @agimon-ai/doompi-web-components (both workspace:*) to dependencies; add @tanstack/store 0.11.1, @tanstack/react-store 0.11.1, react 19.2.8, and @types/react 19.2.7 to devDependencies.
      - Change the typecheck script to "tsc --noEmit && tsc --noEmit -p web/tsconfig.json".
      - Replace the placeholder item view and the hub watcher stub with the package's real records and source; the channel name constant in src/types must equal the doompiWeb channels entry.
      - Every Pi tool this package registers needs a timeline item: scaffold one per tool with scaffold-doom-web-tool-card and list it under toolRenderers (web-plugin-tool-renderers checks package.json against src/** and web/**). The shell owns the frame, tone, badge, and expand toggle; a card supplies the header summary and the body.
      - Run pnpm install, pnpm fixcode, then lint, typecheck, test, build, and pnpm vibe-lint check --preflight-only on web/, src/types, src/adapters/web*, and package.json.
      - To iterate with hot reload, run the cockpit's dev loop: the hub on 7433, then pnpm dev in packages/minor/doompi-web with DOOMPI_WEB_PLUGIN_ROOTS naming this package (or after a doompi sync), and open port 7434.
    patterns:
      - web/**
      - src/types/web*.ts
      - src/adapters/web*Channel.ts
      - src/exports/webHub.ts
  - name: scaffold-doom-web-tool-card
    description: Add the cockpit timeline item for one Pi tool this package registers, a message renderer on the shared MessageItem shell, with its pure view module and a unit test.
    variables_schema:
      type: object
      properties:
        toolName:
          type: string
          description: The tool name exactly as registerTool's name gives it, snake_case
          pattern: "^[a-z][a-z0-9]*(_[a-z0-9]+)*$"
          maxLength: 48
          example: write_report
        toolSummary:
          type: string
          description: What the tool does, in one line, for the card's doc comment
          pattern: "^[A-Za-z0-9][A-Za-z0-9 .,;:!?()/-]*$"
          minLength: 1
          maxLength: 240
          example: Write the session report
      required:
        - toolName
        - toolSummary
      additionalProperties: false
    includes:
      - web/ToolCard.tsx->web/{{ toolName | pascalCase }}ToolCard.tsx
      - web/toolRender.ts->web/{{ toolName | camelCase }}ToolRender.ts
      - tests/unit/webToolRender.test.ts->tests/unit/web{{ toolName | pascalCase }}ToolRender.test.ts
    instruction: |-
      Generate the timeline item for the {{ toolName }} tool: web/{{ toolName | pascalCase }}ToolCard.tsx, a message renderer receiving ToolMessageRenderProps and composed from MessageItem, MessageItemHeader, MessageItemBody, MessageItemStatus, and MessageLines; web/{{ toolName | camelCase }}ToolRender.ts, the pure view logic (the tool name constant, the call summary, the result lines) a unit test pins without a DOM.

      The shell owns the frame, the outcome tone, the status badge, and the expand toggle; the card supplies the header summary and the body lines and sets `expandable` only when it hides something. The card may act through props.sendSessionFrame and props.openTab, and it may open its own slots with props.renderSlot.

      Complete the package integration after generation:
      - Register it in web/index.ts: toolRenderers: [{ tools: [{{ toolName | camelCase }}ToolName], message: {{ toolName | pascalCase }}ToolCard }] (one entry may list several names). The constant must equal registerTool's name in src/, or web-plugin-tool-renderers fails on package.json.
      - Replace the placeholder call summary and result lines with what the tool's args and details really carry.
      - Run pnpm fixcode, then lint, typecheck (both tsconfigs), test, and pnpm vibe-lint check --preflight-only on web/ and package.json.
    patterns:
      - web/**
