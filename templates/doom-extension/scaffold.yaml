boilerplate:
  - name: scaffold-doom-extension
    targetFolder: packages/default
    description: Create a publishable DoomPi extension using typed plugin declarations, controllers, services, and automatic lifecycle ownership.
    variables_schema:
      type: object
      properties:
        packageName:
          type: string
          description: Publishable package folder/name without the @agimon-ai scope (doompi-* in kebab-case)
          pattern: ^doompi-[a-z][a-z0-9]*(-[a-z0-9]+)*$
          maxLength: 58
          example: doompi-log
        packageDescription:
          type: string
          description: Public npm package description; quotes, backslashes, and newlines are rejected so generated JSON stays valid
          pattern: ^[A-Za-z0-9][A-Za-z0-9 .,;:!?()/-]*$
          minLength: 1
          maxLength: 240
          example: Session metrics for DoomPi
        packageKeyword:
          type: string
          description: Lowercase capability-specific npm search keyword
          pattern: ^[a-z][a-z0-9]*(-[a-z0-9]+)*$
          minLength: 2
          maxLength: 40
          example: session-metrics
        commandName:
          type: string
          description: Pi command name without the leading slash
          pattern: ^[a-z][a-z0-9]*(-[a-z0-9]+)*$
          example: doom-log
        commandDescription:
          type: string
          description: Command help text and default service response
          pattern: ^[A-Za-z0-9][A-Za-z0-9 .,;:!?()/-]*$
          minLength: 1
          example: Show session metrics
        author:
          type: string
          description: Package author and copyright holder
          pattern: ^[A-Za-z0-9][A-Za-z0-9 .,'()-]*$
          minLength: 1
          maxLength: 120
          default: Vuong Ngo
          example: Vuong Ngo
        copyrightYear:
          type: string
          description: Year recorded in the LICENSE copyright line
          pattern: ^[0-9]{4}$
          default: "2026"
          example: "2026"
      required:
        - packageName
        - packageDescription
        - packageKeyword
        - commandName
        - commandDescription
      additionalProperties: false
    includes:
      - .oxlintrc.json
      - LICENSE
      - README.md
      - llms.txt
      - package.json
      - project.json
      - tsconfig.json
      - tsdown.config.ts
      - vitest.config.ts
      - vibe-lint.config.yaml
      - src/exports/index.ts
      - src/services/extensionService/type.ts
      - src/services/extensionService/index.ts
      - src/constants/command.ts->src/constants/{{ commandName | camelCase }}.ts
      - src/controllers/command.ts->src/controllers/{{ commandName | camelCase }}Command.ts
      - 'src/prompts/use/SKILL.md->src/prompts/doompi-use-{{ packageName | replace: "doompi-", "" | kebabCase }}/SKILL.md'
      - tests/unit/services/extensionService.test.ts
      - tests/integration/extensions/pi.test.ts
      - tests/contract/packageShape.test.ts
      - src/extensions/pi.ts
    instruction: |-
      Generate only used folders. Host entries live directly in src/extensions/pi.ts, server.ts, and web.ts. src/exports contains flat, pure public re-export modules for services, constants, types, and schemas. Never re-export extensions from src/exports.

      Dependency direction: extensions -> controllers -> services/models. Tools consume services/models. Services own all package logic, including filesystem and network work, under src/services/{serviceName}/index.ts and type.ts. Models own state. Controllers translate API, method, and command requests. Constants own metadata and guidance; schemas own runtime validation. Do not generate adapters, containers, commands, or providers directories.

      Use definePiExtension({name, ...contributions}) for static plugins or definePiExtension(name, context => contributions) for per-mount dependencies. Pi factories and server scope factories may be async; readiness awaits their contribution result before registration. Most contributions are arrays. Pi tools may instead use a typed PiToolCollection with snapshot() and subscribe(listener). Reuse immutable declarations across snapshots. A new declaration with the same name replaces the implementation and aborts old invocations. The helper owns subscriptions and cancels withdrawn tools. Pi minorModes may use PiMinorModeCollection with snapshot() and subscribe(listener) when catalog availability changes; the helper owns attachment, withdrawal, provider rebinding, and unsubscribe. Shared tools use defineTool and commands use defineCommand. No mandatory setup, teardown, registration callbacks, or empty lifecycle hooks. The helper owns Cordis, registrations, and cleanup.

      Lifecycle: construct declarations, register, await onStart, run, abort signal, await onStop, unregister in reverse order, await onDispose. Hooks receive one typed context. onStop runs after the start stage is reached, even if onStart is absent or fails. Factories create state; onStart begins external work. Scope activation and minor-mode actions are separate lifetimes.

      Use extensionless source imports without /index. tsdown uses explicit entries from src/extensions and flat src/exports. Browser entries remain source-bundled and excluded from the node build. Keep exports closed and Pi versions matching. Prompts remain published resources under src/prompts, indexed by llms.txt and declared through resources.

      Run pnpm fixcode, lint, typecheck, tests, build, VibeLint preflight, and npm pack --dry-run. Add APIs, server, web, tools, or services through the matching feature only when needed.
features:
  - name: scaffold-doom-plugin-method
    description: Add one exact-scope typed browser-to-server method to an extension that already has a server facet and web plugin.
    variables_schema:
      type: object
      properties:
        methodName:
          type: string
          pattern: ^[a-z][a-zA-Z0-9]*$
          example: readSelection
        serviceName:
          type: string
          pattern: ^[a-z][a-z0-9.]*$
          example: document.selection
        scope:
          type: string
          enum:
            - global
            - workspace
          example: workspace
      required:
        - methodName
        - serviceName
        - scope
      additionalProperties: false
    includes:
      - src/types/pluginMethod.ts->src/types/{{ methodName | camelCase }}Protocol.ts
      - src/schemas/pluginMethod.ts->src/schemas/{{ methodName | camelCase }}Method.ts
      - src/controllers/pluginMethod.ts->src/controllers/{{ methodName | camelCase }}Method.ts
      - src/web/api/pluginMethod.ts->src/web/api/{{ methodName | camelCase }}.ts
    instruction: Replace example JSON shapes with the package contract. Include the defineServerMethod controller in the {{ scope }} scope's methods array. The helper owns registration and validates scope. The browser calls the typed method using its WebPluginRuntime. Controllers delegate business work to services. Use HTTP for binary transfers. Test request and response validation.
    patterns:
      - src/types/**/*.ts
      - src/schemas/**/*.ts
      - src/controllers/**/*.ts
      - src/web/api/**/*.ts
  - name: scaffold-doom-prompt
    description: Add one package-owned DoomPi Help prompt under src/prompts for either extension authoring or user guidance.
    variables_schema:
      type: object
      properties:
        promptName:
          type: string
          description: Help skill name beginning with doompi-author- or doompi-use-
          pattern: ^doompi-(author|use)-[a-z][a-z0-9]*(-[a-z0-9]+)*$
          maxLength: 64
          example: doompi-use-log
        promptDescription:
          type: string
          description: Concise discovery description explaining what the prompt helps with and when it applies
          pattern: ^[A-Za-z0-9][A-Za-z0-9 .,;:!?()/@-]*$
          minLength: 1
          maxLength: 480
          example: Use DoomPi Log to inspect structured session diagnostics
      required:
        - promptName
        - promptDescription
      additionalProperties: false
    includes:
      - src/prompts/prompt/SKILL.md->src/prompts/{{ promptName | kebabCase }}/SKILL.md
    instruction: Generate the package-owned prompt and link it from llms.txt. Add its matching name and description to the Pi plugin resources array, using package source and import.meta.url. The helper binds the optional Help provider and removes the contribution automatically. Publish src/prompts, never export Markdown or copy it into dist. Run package contract and integration tests.
    patterns:
      - src/prompts/**/*.md
  - name: scaffold-doom-service
    description: Add one host-neutral service under src/services with its unit test.
    variables_schema:
      type: object
      properties:
        serviceName:
          type: string
          description: camelCase service module and function name
          pattern: ^[a-z][a-zA-Z0-9]*$
          maxLength: 48
          example: idlePolicy
        serviceDescription:
          type: string
          description: What the service decides or derives, in one line
          pattern: ^[A-Za-z0-9][A-Za-z0-9 .,;:!?()/-]*$
          minLength: 1
          maxLength: 240
          example: Decide whether an idle session should stop
      required:
        - serviceName
        - serviceDescription
      additionalProperties: false
    includes:
      - src/services/service/index.ts->src/services/{{ serviceName | camelCase }}/index.ts
      - src/services/service/type.ts->src/services/{{ serviceName | camelCase }}/type.ts
      - tests/unit/services/service.test.ts->tests/unit/services/{{ serviceName | camelCase }}.test.ts
    instruction: Implement package logic under src/services/{{ serviceName | camelCase }}/. Keep its input/result contracts in type.ts and import the directory without /index or .ts. Services may use platform APIs when needed but must not import extensions, controllers, or tools. Models own shared state. Publish selected service interfaces through flat src/exports modules only when other packages consume them. Replace placeholder behavior and verify meaningful unit tests.
    patterns:
      - src/services/**/*.ts
  - name: scaffold-doom-tool-restriction
    description: Add a Doom tool-surface restriction that hides tools while the package is active, with its typed lifecycle contribution and unit test.
    variables_schema:
      type: object
      properties:
        restrictionName:
          type: string
          description: camelCase name of the state that hides tools, used for the module and function names
          pattern: ^[a-z][a-zA-Z0-9]*$
          maxLength: 48
          example: voiceMode
        restrictionDescription:
          type: string
          description: Which tools this hides and while what is true, in one line
          pattern: ^[A-Za-z0-9][A-Za-z0-9 .,;:!?()/-]*$
          minLength: 1
          maxLength: 240
          example: Hide file writes while voice mode is speaking
        packageName:
          type: string
          description: This package's npm name, used as the restriction owner label
          pattern: ^@[a-z0-9-]+/[a-z0-9-]+$
          maxLength: 64
          example: "@agimon-ai/doompi-voice"
      required:
        - restrictionName
        - restrictionDescription
        - packageName
      additionalProperties: false
    includes:
      - src/services/toolRestriction/index.ts->src/services/{{ restrictionName | camelCase }}Tools/index.ts
      - src/services/toolRestriction/type.ts->src/services/{{ restrictionName | camelCase }}Tools/type.ts
      - src/constants/toolRestriction.ts->src/constants/{{ restrictionName | camelCase }}Tools.ts
      - tests/unit/services/toolRestriction.test.ts->tests/unit/services/{{ restrictionName | camelCase }}Tools.test.ts
    instruction: Replace placeholder restricted tool names with the feature policy. Include create{{ restrictionName | pascalCase }}ToolSurface(state) in toolRestrictions. State exposes isActive and subscribe; the helper owns subscription and registration disposal. Restrictions only remove incoming tools. Never write pi.setActiveTools or manually retain registrar handles. Test state changes and composition with other restrictions.
    patterns:
      - src/services/**/*.ts
      - src/constants/**/*.ts
  - name: scaffold-doom-server-facet
    description: Add the package's server facet, the Cordis object plugin a session server or the cockpit hub installs to mount its HTTP API, with its unit test.
    variables_schema:
      type: object
      properties:
        facetName:
          type: string
          description: camelCase prefix for the exported facet, usually the package's short name
          pattern: ^[a-z][a-zA-Z0-9]*$
          maxLength: 48
          example: runner
        apiModule:
          type: string
          description: Extensionless import from src/extensions/server.ts to the API controller
          pattern: ^\.\.?/[A-Za-z0-9_./-]+$
          maxLength: 120
          example: ../controllers/runnerApi
        scope:
          type: string
          description: Which host installs this facet
          enum:
            - session
            - hub
          example: session
        scopeReason:
          type: string
          description: Why the surface belongs to that scope, in one line and lower case
          pattern: ^[a-z][A-Za-z0-9 .,;:!?()/'-]*$
          minLength: 1
          maxLength: 200
          example: the runner log belongs to the session that owns the runners
      required:
        - facetName
        - apiModule
        - scope
        - scopeReason
      additionalProperties: false
    includes:
      - src/extensions/server.ts
      - tests/unit/extensions/server.test.ts
    instruction: |-
      Generate defineServerPlugin with a stable name and explicit supported global/workspace/session sections. Static sections contain contribution arrays; stateful sections are sync or async factories receiving one typed context. API declarations come from controllers. Shared tools and commands are defined once and reused by Pi and server.

      Add doompiServer.entry './src/extensions/server.ts', dist './dist/extensions/server.mjs', and supported scopes. Add the matching closed ./extensions/server package export and 'extensions/server': 'src/extensions/server.ts' tsdown entry. apiModule must be an extensionless relative import from src/extensions to its controller.

      Only add onStart, onStop, onDispose when work exists. Factories construct state, onStart begins background work, onStop stops it before registrations are removed, and onDispose performs final instance cleanup. The helper handles Cordis and registration cleanup, including failure rollback. Never use setup/teardown, low-level host registration, or separate headless facets.
    patterns:
      - src/extensions/server.ts
      - src/controllers/**/*.ts
  - name: scaffold-doom-command
    description: Add a shared Pi/server command controller and its integration test.
    variables_schema:
      type: object
      properties:
        commandName:
          type: string
          description: Pi command name without the leading slash
          pattern: ^[a-z][a-z0-9]*(-[a-z0-9]+)*$
          maxLength: 48
          example: doom-log
        commandDescription:
          type: string
          description: Command help text shown in the Pi command list
          pattern: ^[A-Za-z0-9][A-Za-z0-9 .,;:!?()/-]*$
          minLength: 1
          maxLength: 240
          example: Show session metrics
      required:
        - commandName
        - commandDescription
      additionalProperties: false
    includes:
      - src/constants/featureCommand.ts->src/constants/{{ commandName | camelCase }}.ts
      - src/controllers/featureCommand.ts->src/controllers/{{ commandName | camelCase }}Command.ts
      - tests/integration/controllers/featureCommand.test.ts->tests/integration/controllers/{{ commandName | camelCase }}Command.test.ts
    instruction: Declare a shared command controller through defineCommand. Its execute handler delegates to an injected service and uses execution.notify. Include the returned declaration in Pi and/or session server commands arrays. The helper adapts notifications to the host. Metadata lives in constants; behavior lives in services. Document the command and test its result.
    patterns:
      - src/controllers/**/*.ts
  - name: scaffold-doom-provider
    description: Add one Cordis provider under src/providers that publishes a service on the shared Context.
    variables_schema:
      type: object
      properties:
        providerName:
          type: string
          description: kebab-case capability name, used for the class name and the doom/ service key
          pattern: ^[a-z][a-z0-9]*(-[a-z0-9]+)*$
          maxLength: 48
          example: session-metrics
        providerDescription:
          type: string
          description: What the provider publishes for other extensions to consume
          pattern: ^[A-Za-z0-9][A-Za-z0-9 .,;:!?()/-]*$
          minLength: 1
          maxLength: 240
          example: Publish session metrics for other extensions to read
      required:
        - providerName
        - providerDescription
      additionalProperties: false
    includes:
      - src/services/provider/index.ts->src/services/{{ providerName | camelCase }}/index.ts
      - src/services/provider/type.ts->src/services/{{ providerName | camelCase }}/type.ts
      - src/constants/provider.ts->src/constants/{{ providerName | camelCase }}.ts
    instruction: Implement a Cordis service in its service directory and pass create{{ providerName | pascalCase }}Plugin(source) in the extension services array. The shared helper mounts service fibers before other contributions and owns disposal. Native Pi model providers remain the distinct providers field. Keep the shared service contract in type.ts and key in constants. Consumers require the service through a declared dependency. Do not manually create Context, root.plugin, or leases in extension entries.
    patterns:
      - src/services/**/*.ts
      - src/constants/**/*.ts
  - name: scaffold-doom-service-implementation
    description: Add a service implementation and its colocated interface with a unit test.
    variables_schema:
      type: object
      properties:
        capabilityName:
          type: string
          description: camelCase capability the port names, in the package's own vocabulary
          pattern: ^[a-z][a-zA-Z0-9]*$
          maxLength: 48
          example: clock
        implementationName:
          type: string
          description: Technology name used to distinguish this implementation
          pattern: ^[a-z][a-zA-Z0-9]*$
          maxLength: 48
          example: node
        capabilityDescription:
          type: string
          description: What the capability provides, in one line
          pattern: ^[A-Za-z0-9][A-Za-z0-9 .,;:!?()/-]*$
          minLength: 1
          maxLength: 240
          example: Read the current wall clock time
      required:
        - capabilityName
        - implementationName
        - capabilityDescription
      additionalProperties: false
    includes:
      - src/services/implementation/type.ts->src/services/{{ capabilityName | camelCase }}/type.ts
      - src/services/implementation/index.ts->src/services/{{ capabilityName | camelCase }}/index.ts
      - tests/unit/services/implementation.test.ts->tests/unit/services/{{ capabilityName | camelCase }}.test.ts
    instruction: Put the capability contract in src/services/{{ capabilityName | camelCase }}/type.ts and its implementation in index.ts. Reuse an existing contract when present. Construct dependencies in the per-mount extension factory and pass them to controllers/services. No adapters or container directories. Keep effects in the service and start long-lived work through onStart with shutdown through onStop.
    patterns:
      - src/services/**/*.ts
  - name: scaffold-doom-package-api
    description: Add this package's HTTP API, served by the session's own doompi-server, by the cockpit hub, or by both, with its shared route vocabulary and a unit test.
    variables_schema:
      type: object
      properties:
        pluginId:
          type: string
          description: The kebab-case base path the API is mounted under, /api/plugin/<pluginId>; unique across every installed package
          pattern: ^[a-z][a-z0-9]*(-[a-z0-9]+)*$
          maxLength: 48
          example: runner
        topic:
          type: string
          description: camelCase stem for the adapter, the route vocabulary module, and the view types
          pattern: ^[a-z][a-zA-Z0-9]*$
          maxLength: 48
          example: runner
      required:
        - pluginId
        - topic
      additionalProperties: false
    includes:
      - src/types/topicApi.ts->src/types/{{ topic | camelCase }}Api.ts
      - src/controllers/topicApi.ts->src/controllers/{{ topic | camelCase }}Api.ts
      - src/exports/sessionApi.ts
      - tests/unit/topicApi.test.ts->tests/unit/{{ topic | camelCase }}Api.test.ts
    instruction: Put HTTP request handling in the controller and delegate package behavior to services. Routes are relative to the host mount. Include api in defineServerPlugin's appropriate global/workspace/session api arrays. Do not use a hub scope. Add a direct server extension entry and explicit tsdown entry plus manifest export if absent. src/exports/sessionApi.ts is a flat public module; include its tsdown entry and package subpath only when external consumers need it. Never create nested export wrappers. Test requests through the API harness.
    patterns:
      - src/types/*Api.ts
      - src/controllers/*Api.ts
      - src/exports/sessionApi.ts
  - name: scaffold-doom-web-plugin
    description: Add this package's browser-only cockpit plugin under web/ with its per-session store, shared view types, and component tests.
    variables_schema:
      type: object
      properties:
        pluginId:
          type: string
          description: The kebab-case web plugin id, also the tab id and URL segment; unique across every installed plugin
          pattern: ^[a-z][a-z0-9]*(-[a-z0-9]+)*$
          maxLength: 48
          example: runners
        topic:
          type: string
          description: camelCase stem for the store, panel, view types, and channel module names
          pattern: ^[a-z][a-zA-Z0-9]*$
          maxLength: 48
          example: runners
        channelName:
          type: string
          description: The snake_case wire frame type the hub publishes and the plugin claims; unique across every installed plugin
          pattern: ^[a-z][a-z0-9]*(_[a-z0-9]+)*$
          maxLength: 48
          example: runner_runs
      required:
        - pluginId
        - topic
        - channelName
      additionalProperties: false
    includes:
      - src/extensions/web.ts
      - src/web/topicStore.ts->src/web/stores/{{ topic | camelCase }}Store.ts
      - src/web/TopicPanel.tsx->src/web/components/{{ topic | pascalCase }}Panel.tsx
      - src/web/tsconfig.json
      - src/types/webTopic.ts->src/types/web{{ topic | pascalCase }}.ts
      - tests/unit/webTopicStore.test.ts->tests/unit/web{{ topic | pascalCase }}Store.test.ts
      - tests/web/topicPanel.test.ts->tests/web/{{ topic | camelCase }}Panel.test.ts
    instruction: |-
      Declare webPlugin through defineWebPlugin directly in src/extensions/web.ts. Use session/global contribution objects. Keep components, stores, hooks, api, and lib under src/web. Shared wire view types remain browser-safe.

      Add doompiWeb.pluginId, channels, and client './src/extensions/web.ts' to package.json. Publish src/extensions/web.ts, src/web, and every imported shared type/constant. Exclude the browser entry from node tsdown/typecheck; include it in src/web/tsconfig.json. Add the web contracts/components workspace dependencies plus the current React/TanStack dependencies. Typecheck both node and browser projects.

      Store state with defineSessionStore and declare its channels. The server declares the producer through its channels contribution array. Add tool renderers to the session contribution for each Pi tool. Tests belong in tests/web and tests/unit, never src/web. Use typed client methods for server calls. Run lint, both typechecks, tests, and build.
    patterns:
      - src/extensions/web.ts
      - src/web/**
      - src/types/web*.ts
  - name: scaffold-doom-web-tool-card
    description: Add the cockpit timeline item for one Pi tool this package registers, a message renderer on the shared MessageItem shell, with its pure view module and a unit test.
    variables_schema:
      type: object
      properties:
        toolName:
          type: string
          description: The tool name exactly as registerTool's name gives it, snake_case
          pattern: ^[a-z][a-z0-9]*(_[a-z0-9]+)*$
          maxLength: 48
          example: write_report
        toolSummary:
          type: string
          description: What the tool does, in one line, for the card's doc comment
          pattern: ^[A-Za-z0-9][A-Za-z0-9 .,;:!?()/-]*$
          minLength: 1
          maxLength: 240
          example: Write the session report
      required:
        - toolName
        - toolSummary
      additionalProperties: false
    includes:
      - src/web/ToolCard.tsx->src/web/components/{{ toolName | pascalCase }}ToolCard.tsx
      - src/web/toolRender.ts->src/web/lib/{{ toolName | camelCase }}ToolRender.ts
      - tests/unit/webToolRender.test.ts->tests/unit/web{{ toolName | pascalCase }}ToolRender.test.ts
    instruction: |-
      Generate the timeline item for the {{ toolName }} tool: src/web/components/{{ toolName | pascalCase }}ToolCard.tsx, a message renderer receiving ToolMessageRenderProps and composed from MessageItem, MessageItemHeader, MessageItemBody, MessageItemStatus, and MessageLines; src/web/lib/{{ toolName | camelCase }}ToolRender.ts, the pure view logic (the tool name constant, the call summary, the result lines) a unit test pins without a DOM.

      The shell owns the frame, the outcome tone, the status badge, and the expand toggle; the card supplies the header summary and the body lines and sets `expandable` only when it hides something. The card may act through props.sendSessionFrame and props.openTab, and it may open its own slots with props.renderSlot.

      Complete the package integration after generation:
      - Register it in src/extensions/web.ts: session: { toolRenderers: [{ tools: [{{ toolName | camelCase }}ToolName], message: {{ toolName | pascalCase }}ToolCard }] (one entry may list several names). The constant must equal registerTool's name in src/, or web-plugin-tool-renderers fails on package.json.
      - Replace the placeholder call summary and result lines with what the tool's args and details really carry.
      - Run pnpm fixcode, then lint, typecheck (both tsconfigs), test, and pnpm vibe-lint check --preflight-only on src/web and package.json.
    patterns:
      - src/web/**
  - name: scaffold-doom-constants
    description: Add shared command metadata in the lowest dependency layer.
    variables_schema:
      type: object
      properties:
        commandName:
          type: string
          pattern: ^[a-z][a-z0-9]*(-[a-z0-9]+)*$
        commandDescription:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9 .,;:!?()/-]*$
      required:
        - commandName
        - commandDescription
      additionalProperties: false
    includes:
      - src/constants/featureCommand.ts->src/constants/{{ commandName | camelCase }}.ts
    instruction: Put names, descriptions, and shared guidance in src/constants. Constants contain data only and may import only constants. Controllers, services, tools, schemas, types, models, and browser code consume these values rather than duplicate them.
    patterns:
      - src/constants/**/*.ts
