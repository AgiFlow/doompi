plugins:
  - core
  - doom-extension

extends:
  - core/recommended
  - doom-extension/recommended

rules:
  boundary-import-allowlist: error
  file-naming-convention: error

overrides:
  # This package is the CLI host, not a feature extension. Its commands are
  # top-level composition roots that assemble adapters and run them, where an
  # extension's commands are thin translators over services. The global layer
  # graph is written for the extension shape and stays strict there.
  - files:
      - src/commands/**/*.ts
    rules:
      boundary-import-allowlist: off
      doom-layer-boundary: off
  # Sync orchestration: the runner drives the sync pipeline it was given.
  - files:
      - src/adapters/dpiRunner.ts
    rules:
      boundary-import-allowlist: off
      doom-layer-boundary: off
  # Listed in the plugin's own compositionPaths: it assembles extensions from
  # resolved module paths, so it reads them through the adapter that resolves them.
  - files:
      - src/services/extensionAssembler.ts
    rules:
      boundary-import-allowlist: off
      doom-layer-boundary: off
      service-boundary: off

  # Reads time, randomness or process state ambiently instead of taking it as a
  # dependency. Each needs a clock, id factory or env threaded through its
  # caller; until then the rule stays on for every other module here.
  - files:
      - src/services/modeCatalog.ts # Date
    rules:
      no-ambient-host-access: off
