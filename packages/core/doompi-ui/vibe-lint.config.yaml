# The browser half of this package lives in src/web, which the doom-extension
# preset does not colour-check. doom-web owns that rule and its scope covers
# src/web, so the plugin is declared for the one rule rather than for its
# preset: the rest of that preset describes a cockpit host's client layers
# (stores, features, routes, app), which a plugin's flat src/web does not use,
# so it stays unenabled here.
plugins:
  - core
  - doom-extension
  - doom-web

extends:
  - core/recommended
  - doom-extension/recommended

rules:
  no-raw-theme-color: error
  boundary-import-allowlist: error
  file-naming-convention: error
  package-layer-order:
    - error
    - packageLayers:
        "@agimon-ai/doompi-extension-contracts": contracts
        "@agimon-ai/doompi-hashline": contracts
        "@agimon-ai/doompi-telemetry": contracts
        "@agimon-ai/doompi-web-contracts": contracts
        "@agimon-ai/doompi-web-components": contracts
        "@agimon-ai/doompi-config": platform
        "@agimon-ai/doompi-ui": platform
        "@agimon-ai/doompi-mcp": integration
        "@agimon-ai/doompi": host
