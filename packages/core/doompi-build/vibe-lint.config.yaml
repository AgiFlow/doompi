plugins:
  - core
  - doom-extension

extends:
  - core/recommended
  - doom-extension/recommended

rules:
  boundary-import-allowlist: error
  file-naming-convention: error
  # Build tooling, not a Pi extension: it registers nothing with a session and
  # runs at config-load time inside a bundler, so it declares no pi.extensions.
  doom-clean-architecture-boundary:
    - error
    - infrastructurePackages:
        - "@agimon-ai/doompi-build"
      foundationPackages:
        - "@agimon-ai/doompi-build"
      nonPiPackages:
        - "@agimon-ai/doompi-build"
  package-layer-order:
    - error
    - packageLayers:
        "@agimon-ai/doompi-build": contracts
