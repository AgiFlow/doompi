# The browser half of this package lives in web/, which the doom-extension
# preset does not colour-check. doom-web owns that rule and its scope already
# covers web/, so the plugin is declared for the one rule rather than for its
# preset: the rest of that preset is scoped to a cockpit host's src/web tree
# and would not apply here.
plugins:
  - core
  - doom-extension
  - doom-web

extends:
  - core/recommended
  - doom-extension/recommended

rules:
  no-raw-theme-color: error
  boundary-import-allowlist: error
  file-naming-convention: error

overrides:
  # responseEnvelope carries the bash tool result shape and reads the log files
  # that back it, so both the command and its renderer depend on it. Splitting
  # the pure shape from the filesystem reads is tracked separately; until then
  # these three modules cross the command/tui line in both directions.
  - files:
      - src/commands/bash/bashTool.ts
      - src/tui/bashRender.ts
      - src/tui/format.ts
    rules:
      boundary-import-allowlist: off
      doom-layer-boundary: off

  # Reads time, randomness or process state ambiently instead of taking it as a
  # dependency. Each needs a clock, id factory or env threaded through its
  # caller; until then the rule stays on for every other module here.
  - files:
      - src/services/runs/session.ts # process
    rules:
      no-ambient-host-access: off
