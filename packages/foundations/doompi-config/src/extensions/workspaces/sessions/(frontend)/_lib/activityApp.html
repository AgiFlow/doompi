<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Doompi tool activity</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: var(--font-sans, system-ui, sans-serif);
        font-size: 13px;
        line-height: 1.5;
        color: var(--color-text-primary, CanvasText);
        background: var(--color-background-primary, Canvas);
      }
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      body {
        margin: 0;
      }
      main {
        padding: 1rem;
        min-width: 0;
      }
      header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 1rem;
      }
      h1 {
        margin: 0;
        font-size: 15px;
        line-height: 1.4;
        overflow-wrap: anywhere;
      }
      #duration {
        flex-shrink: 0;
        font-variant-numeric: tabular-nums;
      }
      #status {
        margin: 0.5rem 0 0.75rem;
      }
      #status[data-state='error'] {
        color: var(--color-text-danger, CanvasText);
        font-weight: 600;
      }
      #status[data-state='running'],
      #status[data-state='pending'] {
        color: var(--color-text-info, CanvasText);
      }
      #duration,
      dt,
      #note {
        color: var(--color-text-secondary, CanvasText);
        font-size: 12px;
      }
      dl {
        display: grid;
        gap: 0.5rem;
        margin: 0 0 0.75rem;
      }
      dl > div {
        display: grid;
        grid-template-columns: 5rem minmax(0, 1fr);
        gap: 0.75rem;
      }
      dd {
        margin: 0;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }
      details {
        border: 1px solid var(--color-border-primary, GrayText);
        border-radius: 5px;
        overflow: hidden;
      }
      summary {
        padding: 0.75rem;
        cursor: pointer;
        background: var(--color-background-secondary, Canvas);
      }
      summary:focus-visible {
        outline: 2px solid var(--color-border-info, Highlight);
        outline-offset: -2px;
      }
      pre {
        margin: 0;
        padding: 0.75rem;
        max-height: 18rem;
        overflow: auto;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font-family: var(--font-mono, ui-monospace, monospace);
        font-size: 12px;
        line-height: 1.5;
      }
      #note {
        margin: 0;
        padding: 0.75rem;
        border-top: 1px solid var(--color-border-primary, GrayText);
      }
    </style>
  </head>
  <body>
    <main aria-labelledby="heading">
      <header>
        <h1 id="heading">Doompi tool activity</h1>
        <span id="duration" aria-label="Tool duration"></span>
      </header>
      <p id="status" role="status" aria-live="polite" aria-atomic="true" data-state="pending">Connecting to host...</p>
      <dl id="input" aria-label="Tool input summary" hidden></dl>
      <details id="output" open hidden>
        <summary>Tool output</summary>
        <pre id="preview" tabindex="0" aria-label="Tool output preview"></pre>
        <p id="note" hidden></p>
      </details>
    </main>
    <!--APP_SCRIPT-->
  </body>
</html>
