<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Doompi session</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: var(--font-sans, system-ui, sans-serif);
        font-size: 13px;
        line-height: 1.5;
        color: var(--color-text-primary, CanvasText);
        background: var(--color-background-primary, Canvas);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      main {
        padding: 1rem;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
      }
      h1 {
        margin: 0;
        font-size: 15px;
      }
      button {
        font: inherit;
        color: inherit;
        background: var(--color-background-secondary, ButtonFace);
        border: 1px solid var(--color-border-primary, GrayText);
        border-radius: 5px;
        padding: 0.5rem 0.75rem;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      button:focus-visible {
        outline: 2px solid var(--color-border-info, Highlight);
        outline-offset: 2px;
      }
      #status {
        color: var(--color-text-secondary, GrayText);
        margin: 0.75rem 0;
      }
      #status[data-error='true'] {
        color: var(--color-text-danger, CanvasText);
      }
      dl {
        display: grid;
        gap: 0.75rem;
        margin: 0;
      }
      dl[hidden] {
        display: none;
      }
      dl > div {
        display: grid;
        grid-template-columns: 7rem minmax(0, 1fr);
        gap: 0.75rem;
      }
      dt {
        color: var(--color-text-secondary, GrayText);
      }
      dd {
        margin: 0;
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <main aria-labelledby="heading">
      <header>
        <h1 id="heading">Doompi session</h1>
        <button id="refresh" type="button" disabled aria-describedby="status">Refresh</button>
      </header>
      <p id="status" role="status" aria-live="polite" aria-atomic="true">Connecting to host...</p>
      <dl id="summary" hidden>
        <div>
          <dt>Repository</dt>
          <dd id="repositoryName"></dd>
        </div>
        <div>
          <dt>Session</dt>
          <dd id="sessionId"></dd>
        </div>
        <div>
          <dt>Revision</dt>
          <dd id="revision"></dd>
        </div>
        <div>
          <dt>Profile</dt>
          <dd id="profile"></dd>
        </div>
        <div>
          <dt>Major mode</dt>
          <dd id="majorMode"></dd>
        </div>
        <div>
          <dt>Domains</dt>
          <dd id="domains"></dd>
        </div>
        <div>
          <dt>Layers</dt>
          <dd id="layers"></dd>
        </div>
        <div>
          <dt>Minor modes</dt>
          <dd id="minorModes"></dd>
        </div>
      </dl>
    </main>
    <!--APP_SCRIPT-->
  </body>
</html>
