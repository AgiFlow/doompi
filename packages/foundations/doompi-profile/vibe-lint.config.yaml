# The browser half of this package lives under the (frontend) groups in
# src/extensions, which the doom-extension preset does not colour-check.
# doom-web owns that rule and its scope covers the browser half, so the plugin
# is declared for the one rule rather than for its preset: the rest of that
# preset describes a cockpit host's client layers (stores, features, routes,
# app), which a plugin's colocated components do not use, so it stays
# unenabled here.
plugins:
  - core
  - doom-extension
  - doom-web

extends:
  - core/recommended
  - doom-extension/recommended

rules:
  no-raw-theme-color: error
  boundary-import-allowlist: error
  file-naming-convention: error
