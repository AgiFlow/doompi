# The layer graph, design patterns, and Pi-entry overrides come from the
# doom-extension plugin preset. Declare only what is specific to this package.
plugins:
  - core
  - doom-extension

extends:
  - core/recommended
  - doom-extension/recommended

rules:
  # A session server publishes an executable and a socket, not a Pi extension,
  # so it declares itself alongside the other non-Pi packages.
  doom-clean-architecture-boundary:
    - error
    - nonPiPackages:
        - "@agimon-ai/doompi-extension-contracts"
        - "@agimon-ai/doompi-telemetry"
        - "@agimon-ai/doompi-server"
  # A standalone client process sits above the host it drives: it composes a
  # session by calling the launcher's own published preparation rather than
  # spawning a CLI to do it. The preset's tiers stop at `host` because they
  # predate packages/clients, and the tier map replaces rather than extends,
  # so the whole order is restated here. The graph stays acyclic: no core or
  # extension package depends on a client.
  package-layer-order:
    - error
    - packageLayerOrder:
        - contracts
        - platform
        - integration
        - extension
        - host
        - client
      packageLayers:
        "@agimon-ai/doompi-extension-contracts": contracts
        "@agimon-ai/doompi-telemetry": contracts
        "@agimon-ai/doompi-web-contracts": contracts
        "@agimon-ai/doompi-web-components": contracts
        "@agimon-ai/doompi-config": platform
        "@agimon-ai/doompi-ui": platform
        "@agimon-ai/doompi-cache": integration
        "@agimon-ai/doompi-mcp": integration
        "@agimon-ai/doompi": host
        "@agimon-ai/doompi-server": client
        "@agimon-ai/doompi-web": client
  boundary-import-allowlist: error
  file-naming-convention: error
  public-export-boundary: error
  no-internal-public-import: error
  doom-layer-boundary: error
