plugins:
  - core
  - doom-extension

extends:
  - core/recommended
  - doom-extension/recommended

rules:
  boundary-import-allowlist: error
  file-naming-convention: error

# The web cockpit plugin lives in web/ (outside src/, which the doom-extension
# folder vocabulary owns). Its declaration may reach its own files and the
# shared src/types shapes.
boundaries:
  - name: web-plugin
    pattern: web/**
    allowedImports:
      - web/**
      - src/types
      - src/types/**
