# The browser half of this package lives in src/web, which the doom-extension
# preset does not colour-check. doom-web owns that rule and its scope covers
# src/web, so the plugin is declared for the one rule rather than for its
# preset: the rest of that preset describes a cockpit host's client layers
# (stores, features, routes, app), which a plugin's flat src/web does not use,
# so it stays unenabled here.
plugins:
  - core
  - doom-extension
  - doom-web

extends:
  - core/recommended
  - doom-extension/recommended

rules:
  no-raw-theme-color: error
  boundary-import-allowlist: error
  file-naming-convention: error

overrides:
  # Reads time, randomness or process state ambiently instead of taking it as a
  # dependency. Each needs a clock, id factory or env threaded through its
  # caller; until then the rule stays on for every other module here.
  - files:
      - src/services/autonomousVoiceTelemetry.ts # Date
      - src/services/commandCorrection.ts # setTimeout()
      - src/services/fallbackNarration.ts # setTimeout()
      - src/services/voiceWorkerSupervisor.ts # Date
    rules:
      no-ambient-host-access: off
  # This module runs only inside a dedicated Web Worker. ONNX Runtime is the
  # selected processor, and worker-local recurrent state cannot leak into the UI.
  - files:
      - src/web/sileroVadWorker.ts
    rules:
      web-plugin-import-allowlist: off
      web-plugin-no-module-state: off
