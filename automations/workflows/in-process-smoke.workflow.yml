name: In-process Smoke
description: Exercise a run step, an interactive step, a templated agent step and a parallel group when the DoomPi server runs a workflow in-process.
tags:
  - example
  - testing

imports:
  - commands.yml

# Launched from the DoomPi server this is ignored: the run executes in-process.
launch-command: 'pnpm exec workflow-mcp launch-process --launcher "${WORKFLOW_LAUNCHER:-tmux}" --name "{name}" --cwd "$PWD" --command "{command}"'

run-directory:
  description: What each step leaves behind.
  entries:
    - path: agent.md
      kind: file
      description: Written by the agent step.
      produced-by: [agent]

on:
  workflow_dispatch:

jobs:
  shell:
    description: A plain command in its own pane.
    steps:
      - name: Print from a run step
        run: |
          echo "run step in its own pane: $WORKFLOW_STEP_NAME"
          sleep 5

  interactive:
    description: A command that needs a terminal and a person, and records its own outcome.
    needs: shell
    steps:
      - name: Answer an interactive prompt
        timeout-minutes: 10
        interactiveRun: |
          printf 'type a word and press enter: '
          read -r word
          workflow-mcp step complete --summary "typed $word"

  agent:
    description: An agent step that runs as a child session under the DoomPi server.
    needs: interactive
    steps:
      - name: Agent writes a note
        timeout-minutes: 10
        artifacts:
          - agent.md
        runConfig:
          majorMode: examples
          domains: []
        prompt: |
          Use one shell command to write the single line "in-process agent step ok" to ${{ env.WORKFLOW_RUN_DIR }}/agent.md.
          Then record the step as complete. Do nothing else.
        interactiveRun:
          - command: doompi

  checks:
    description: Two checks side by side, each in its own pane.
    needs: agent
    steps:
      - name: Checks
        parallel:
          - name: first check
            run: |
              echo "first check running beside the second"
              sleep 5
            restart-from: agent
          - name: second check
            run: |
              echo "second check running beside the first"
              sleep 5
            restart-from: agent
