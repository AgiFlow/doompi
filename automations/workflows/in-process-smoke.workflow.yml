name: In-process Smoke
description: Exercise one run, one interactiveRun and one customRun step when the DoomPi server runs a workflow in-process.
tags:
  - example
  - testing

# Launched from the DoomPi server this is ignored: the run executes in-process.
launch-command: 'pnpm exec workflow-mcp launch-process --launcher "${WORKFLOW_LAUNCHER:-tmux}" --name "{name}" --cwd "$PWD" --command "{command}"'

run-directory:
  description: What each step leaves behind.
  entries:
    - path: agent.md
      kind: file
      description: Written by the customRun agent.
      produced-by: [agent]

on:
  workflow_dispatch:

jobs:
  shell:
    description: A plain command in its own pane.
    steps:
      - name: Print from a run step
        run: |
          echo "run step in its own pane: $WORKFLOW_STEP_NAME"
          sleep 5

  interactive:
    description: A command that needs a terminal and a person.
    needs: shell
    steps:
      - name: Answer an interactive prompt
        timeout-minutes: 10
        interactiveRun: |
          printf 'type a word and press enter: '
          read -r word
          echo "you typed: $word"
          echo YES > "$WORKFLOW_STATUS_FILE"
          sleep 600

  agent:
    description: An agent step that runs as a child session.
    needs: interactive
    steps:
      - name: Agent writes a note
        timeout-minutes: 10
        artifacts:
          - agent.md
        runConfig:
          majorMode: examples
          domains: []
        customRun:
          prompt: |
            Use one shell command to write the single line "in-process customRun ok" to ${{ env.WORKFLOW_RUN_DIR }}/agent.md.
            Then reply with one short sentence confirming it. Do nothing else.
        interactiveRun: |
          echo "This step needs the DoomPi server's in-process executor." >&2
          exit 1
