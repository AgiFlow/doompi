# Browser UI components are colocated with their session routes.
# doom-web supplies theme checks for those routed components.
plugins:
  - core
  - doom-extension
  - doom-web

extends:
  - core/recommended
  - doom-extension/recommended

rules:
  no-raw-theme-color: error
  boundary-import-allowlist: error
  file-naming-convention: error

overrides:
  # Routed filenames carry contribution identities and follow their own grammar.
  - files:
      - src/extensions/**
    rules:
      file-naming-convention: off
  # These public subpaths predate routing. Their wrappers keep the published
  # TUI and Pi APIs available while implementations stay beside their routes.
  - files:
      - src/exports/commands.ts
      - src/exports/index.ts
      - src/exports/toolTaskTool.ts
      - src/exports/tuiFormat.ts
      - src/exports/tuiSelectors.ts
      - src/exports/tuiTaskOverlay.ts
      - src/exports/tuiTaskSpace.ts
    rules:
      boundary-import-allowlist: off
      composition-layout: off
  # Story files are read by the style-system renderer, which resolves the
  # default export by looking for a bare `const meta`. Naming the export at the
  # point of definition breaks the render, so the export-shape rules are off
  # here. Every other rule, theming included, still applies to stories.
  - files:
      - src/extensions/**/(frontend)/**/*.stories.tsx
    rules:
      no-default-export: off
      direct-export-only: off
