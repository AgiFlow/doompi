# The browser half of this package lives under the (frontend) groups in
# src/extensions, which the doom-extension preset does not colour-check.
# doom-web owns that rule and its scope covers the browser half, so the plugin
# is declared for the one rule rather than for its preset: the rest of that
# preset describes a cockpit host's client layers (stores, features, routes,
# app), which a plugin's colocated components do not use, so it stays
# unenabled here.
plugins:
  - core
  - doom-extension
  - doom-web

extends:
  - core/recommended
  - doom-extension/recommended

rules:
  no-raw-theme-color: error
  boundary-import-allowlist: error
  file-naming-convention: error

boundaries:
  - name: cli-session-overlay-presentation
    pattern: src/extensions/**/(frontend)/overlay/*.cli.ts
    allowedImports:
      - src/types/**
      - src/constants/**
      - src/services/**
      - src/extensions/**/(frontend)/**
  - name: cli-session-overlay-private
    pattern: src/extensions/**/(frontend)/overlay/_lib/*.ts
    allowedImports:
      - src/types/**
      - src/constants/**
      - src/schemas/**
      - src/services/**
      - src/extensions/**/(frontend)/**
  - name: cli-session-tool-presentation
    pattern: src/extensions/**/(frontend)/tool/*.cli.ts
    allowedImports:
      - src/types/**
      - src/constants/**
      - src/schemas/**
      - src/services/**
      - src/extensions/**/(frontend)/**
  - name: cli-message-presentation
    pattern: src/extensions/**/(frontend)/message/*.cli.ts
    allowedImports:
      - src/types/**
      - src/constants/**
      - src/services/notify
      - src/services/notify/**
      - src/models/slashResult.ts
      - src/extensions/**/(frontend)/**
  - name: cli-message-private
    pattern: src/extensions/**/(frontend)/message/_lib/*.ts
    allowedImports:
      - src/types/**
      - src/constants/**
      - src/models/**
      - src/services/**
      - src/extensions/**/(frontend)/**

overrides:
  # Routed identities follow the folder convention's filename grammar.
  - files:
      - src/extensions/**
    rules:
      file-naming-convention: off
  # Story files are read by the style-system renderer, which resolves the
  # default export by looking for a bare `const meta`. Naming the export at the
  # point of definition breaks the render, so the export-shape rules are off
  # here. Every other rule, theming included, still applies to stories.
  - files:
      - src/extensions/**/*.stories.tsx
    rules:
      no-default-export: off
      direct-export-only: off
