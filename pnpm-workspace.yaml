packages:
  - packages/cli/*
  - packages/core/*
  - packages/foundations/*
  - packages/default/*
  - packages/minor/*
  - packages/clients/*
  - packages/tooling/*
  - packages/utils/*
  - layers/*/*
  - "!**/dist/**"

overrides:
  vite: 8.2.2
  # Keep source installs aligned with the secure policy written to consumer .pi/npm projects.
  "@hono/node-server@2.0.0 - 2.0.9": "^2.0.10"
  "@opentelemetry/core@2.0.0 - 2.7.999": 2.8.0
  "brace-expansion@5.0.0 - 5.0.8": "^5.0.9"
  "fast-uri@3.0.0 - 3.1.5": "^3.1.6"
  "hono@4.0.0 - 4.12.33": "^4.12.34"
  "js-yaml@4.0.0 - 4.3.1": "^4.3.2"
  "js-yaml@5.0.0 - 5.2.1": "^5.2.2"
  "liquidjs@10.0.0 - 10.27.1": "^10.27.2"
  "protobufjs@8.0.0 - 8.7.1": "^8.7.2"
  "smol-toml@0.0.0 - 1.7.0": "^1.7.1"
  "sharp@0.34.5": 0.35.4

# Oxlint resolves its type-aware backend from the workspace root.
publicHoistPattern:
  - oxlint-tsgolint

allowBuilds:
  "@google/genai": false
  "@scarf/scarf": false
  better-sqlite3: true
  # The desktop shell's runtime is downloaded by its own postinstall; without
  # this there is no Electron binary to package or run.
  electron: true
  esbuild: true
  nx: true
  protobufjs: true
  # Prebuilt @img/sharp-* binaries cover every platform we ship; the install
  # script is only a compile-from-source fallback.
  sharp: false

onlyBuiltDependencies:
  - better-sqlite3
  - electron
  - esbuild
  - nx
  - protobufjs

minimumReleaseAge: 2880
minimumReleaseAgeExclude:
  - "@agimon-ai/*"
  - "@earendil-works/chord@0.85.0||0.85.1||0.86.0||0.87.0||0.87.1"
  - "@earendil-works/pi-agent-core@0.85.0||0.85.1||0.86.0||0.87.0||0.87.1"
  - "@earendil-works/pi-ai@0.85.0||0.85.1||0.86.0||0.87.0||0.87.1"
  - "@earendil-works/pi-client@0.85.0||0.85.1||0.86.0||0.87.0||0.87.1"
  - "@earendil-works/pi-coding-agent@0.85.0||0.85.1||0.86.0||0.87.0||0.87.1"
  - "@earendil-works/pi-protocol@0.85.0||0.85.1||0.86.0||0.87.0||0.87.1"
  - "@earendil-works/pi-server@0.85.0||0.85.1||0.86.0||0.87.0||0.87.1"
  - "@earendil-works/pi-session-backend-sqlite-node@0.86.0||0.87.0||0.87.1"
  - "@earendil-works/pi-telemetry@0.85.0||0.85.1||0.86.0||0.87.0||0.87.1"
  - "@earendil-works/pi-tui@0.85.0||0.85.1||0.86.0||0.87.0||0.87.1"
  - "@simplewebauthn/server@13.3.3"
  - "@tanstack/query-core@5.102.1"
  - "@tanstack/react-query@5.102.1"
  - "@tanstack/react-router@1.170.32"
  - "@tanstack/router-core@1.171.27"
  - "protobufjs@7.6.6"
  - electron@44.1.1
