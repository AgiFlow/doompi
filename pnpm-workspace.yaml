packages:
  - packages/core/*
  - packages/default/*
  - packages/minor/*
  - packages/clients/*
  - packages/tooling/*
  - layers/*/*
  - "!**/dist/**"

overrides:
  vite: 8.2.2
  # Keep source installs aligned with the secure policy written to consumer .pi/npm projects.
  "@hono/node-server@2.0.0 - 2.0.9": "^2.0.10"
  "@opentelemetry/core@2.0.0 - 2.7.999": 2.8.0
  "brace-expansion@5.0.0 - 5.0.8": "^5.0.9"
  "fast-uri@3.0.0 - 3.1.5": "^3.1.6"
  "hono@4.0.0 - 4.12.33": "^4.12.34"
  "js-yaml@4.0.0 - 4.3.0": "^4.3.1"
  "js-yaml@5.0.0 - 5.2.1": "^5.2.2"
  "liquidjs@10.0.0 - 10.27.0": "^10.27.1"
  "protobufjs@8.0.0 - 8.7.1": "^8.7.2"

# Oxlint resolves its type-aware backend from the workspace root.
publicHoistPattern:
  - oxlint-tsgolint

allowBuilds:
  "@google/genai": false
  better-sqlite3: true
  # The desktop shell's runtime is downloaded by its own postinstall; without
  # this there is no Electron binary to package or run.
  electron: true
  esbuild: true
  nx: true
  protobufjs: true

onlyBuiltDependencies:
  - better-sqlite3
  - electron
  - esbuild
  - nx
  - protobufjs

minimumReleaseAge: 2880
minimumReleaseAgeExclude:
  - "@agimon-ai/foundation-exec@0.26.16||0.26.19"
  - "@agimon-ai/foundation-port-registry@0.29.16||0.29.19"
  - "@agimon-ai/foundation-process-registry@0.29.16||0.29.19"
  - "@agimon-ai/foundation-validator@0.26.16||0.26.19"
  - "@agimon-ai/log-sink-mcp@0.29.16||0.29.19"
  - "@agimon-ai/mcp-proxy@0.31.16||0.31.19"
  - "@agimon-ai/vibe-lint@0.0.1-alpha.26||0.0.1-alpha.29"
  - "@agimon-ai/workflow-mcp@0.23.16||0.23.19"
  - "@earendil-works/pi-agent-core@0.84.4"
  - "@earendil-works/pi-ai@0.84.4"
  - "@earendil-works/pi-client@0.84.4"
  - "@earendil-works/pi-coding-agent@0.84.4"
  - "@earendil-works/pi-protocol@0.84.4"
  - "@earendil-works/pi-server@0.84.4"
  - "@earendil-works/pi-telemetry@0.84.4"
  - "@earendil-works/pi-tui@0.84.4"
  - "@simplewebauthn/server@13.3.3"
  - "@tanstack/query-core@5.102.1"
  - "@tanstack/react-query@5.102.1"
  - "@tanstack/react-router@1.170.32"
  - "@tanstack/router-core@1.171.27"
  - "protobufjs@7.6.6"
  - electron@44.1.1

# Avoid repeated full-schema scans when Pi validates recursive JSON snapshot fields.
patchedDependencies:
  "@earendil-works/pi-coding-agent@0.84.4": patches/@earendil-works__pi-coding-agent@0.84.4.patch
  "@earendil-works/pi-protocol@0.84.4": patches/@earendil-works__pi-protocol@0.84.4.patch
