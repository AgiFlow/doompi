packages:
  - packages/core/*
  - packages/default/*
  - packages/minor/*
  - packages/tooling/*
  - layers/*/*
  - "!**/dist/**"

overrides:
  vite: 8.2.2
  # Keep source installs aligned with the secure policy written to consumer .pi/npm projects.
  "@hono/node-server@2.0.0 - 2.0.9": "^2.0.10"
  "@opentelemetry/core@2.0.0 - 2.7.999": 2.8.0
  "brace-expansion@5.0.0 - 5.0.8": "^5.0.9"
  "hono@4.0.0 - 4.12.33": "^4.12.34"
  "js-yaml@4.0.0 - 4.3.0": "^4.3.1"
  "js-yaml@5.0.0 - 5.2.1": "^5.2.2"
  "liquidjs@10.0.0 - 10.27.0": "^10.27.1"
  "protobufjs@8.0.0 - 8.7.1": "^8.7.2"

# Oxlint resolves its type-aware backend from the workspace root.
publicHoistPattern:
  - oxlint-tsgolint

allowBuilds:
  "@google/genai": false
  better-sqlite3: true
  esbuild: true
  nx: true
  protobufjs: true

onlyBuiltDependencies:
  - better-sqlite3
  - esbuild
  - nx
  - protobufjs

minimumReleaseAgeExclude:
  - "@agimon-ai/foundation-exec@0.26.16"
  - "@agimon-ai/foundation-port-registry@0.29.16"
  - "@agimon-ai/foundation-process-registry@0.29.16"
  - "@agimon-ai/foundation-validator@0.26.16"
  - "@agimon-ai/log-sink-mcp@0.29.16"
  - "@agimon-ai/mcp-proxy@0.31.16"
  - "@agimon-ai/vibe-lint@0.0.1-alpha.26"
  - "@agimon-ai/workflow-mcp@0.23.16"
